<title>客戶資產管理台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: ledger shell. Client roster on the left, one client's books on the right; the monthly report renders as A4 paper sheets. */
:root {
  --bg: #eff3f1;
  --surface: #ffffff;
  --surface-2: #f5f8f7;
  --line: #d6dfdb;
  --fg: #14201c;
  --fg-2: #4a5a55;
  --fg-3: #7a8a85;
  --accent: #0d6b5e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefea;
  --tw: #2a78d6;
  --us: #eb6834;
  --cash: #94a19c;
  --up: #c8323a;
  --down: #17804a;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --gain: var(--up);
  --loss: var(--down);
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #151d1a; --surface-2: #1b2522; --line: #2a3632;
    --fg: #e6eeeb; --fg-2: #a6b5b0; --fg-3: #7b8b86;
    --accent: #45b5a1; --accent-ink: #062019; --accent-soft: #163631;
    --tw: #3987e5; --us: #d95926; --cash: #7d8a86;
    --up: #f06b6b; --down: #3dba73; --warn: #e3a74a; --warn-soft: #33281a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151d1a; --surface-2: #1b2522; --line: #2a3632;
  --fg: #e6eeeb; --fg-2: #a6b5b0; --fg-3: #7b8b86;
  --accent: #45b5a1; --accent-ink: #062019; --accent-soft: #163631;
  --tw: #3987e5; --us: #d95926; --cash: #7d8a86;
  --up: #f06b6b; --down: #3dba73; --warn: #e3a74a; --warn-soft: #33281a;
  color-scheme: dark;
}
:root[data-updown="intl"] { --gain: var(--down); --loss: var(--up); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
.muted { color: var(--fg-3); }
.small { font-size: 12px; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 18px; letter-spacing: .02em; }
.brand span { font-size: 12px; color: var(--fg-3); letter-spacing: .08em; }
.top .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.chip.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--fg-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--up); }
.btn:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* shell */
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 60px); }
aside { border-right: 1px solid var(--line); background: var(--surface-2); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
aside .label { font-size: 11px; letter-spacing: .12em; color: var(--fg-3); padding: 6px 8px 2px; }
.cl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; text-align: left; background: transparent; width: 100%; }
.cl:hover { background: var(--surface); }
.cl.on { background: var(--surface); border-color: var(--line); }
.cl .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl .aum { grid-column: 1; font-size: 12px; color: var(--fg-3); }
.cl .rt { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 12px; font-weight: 600; }
.side-note { margin-top: auto; font-size: 11px; color: var(--fg-3); padding: 8px; line-height: 1.6; }
main { padding: 20px 24px 48px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; padding: 10px 16px; }
  aside .label, .side-note { display: none; }
  .cl { min-width: 150px; }
  main { padding: 16px 16px 40px; }
}

/* headings & panels */
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head h1 { font-family: var(--font-display); font-size: 26px; margin: 0; line-height: 1.2; text-wrap: balance; }
.head .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.panel h2 { font-size: 13px; margin: 0 0 12px; letter-spacing: .06em; color: var(--fg-2); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel h2 .r { margin-left: auto; font-weight: 400; letter-spacing: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { padding: 9px 14px; border: 0; background: transparent; cursor: pointer; color: var(--fg-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--fg-3); letter-spacing: .04em; }
.kpi .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; overflow-wrap: anywhere; }
.kpi .s { font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; }

/* tables */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
table.t th.n, table.t td.n { text-align: right; }
table.t tr.total td { font-weight: 600; border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
.cell { width: 100%; min-width: 64px; padding: 4px 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; }
.cell:hover { border-color: var(--line); }
.cell:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.cell.num { text-align: right; font-variant-numeric: tabular-nums; }
.mk { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; color: #fff; }
.mk.TW { background: var(--tw); }
.mk.US { background: var(--us); }

/* forms */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f label { font-size: 12px; color: var(--fg-2); }
.f input, .f select, .f textarea, textarea.box { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; }
.f .hint { font-size: 11px; color: var(--fg-3); }
.f.wide { grid-column: 1 / -1; }
textarea.box { min-height: 110px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 12px; color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; line-height: 1.7; }
.note.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
details.tool { border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--surface-2); }
details.tool > summary { cursor: pointer; padding: 10px 0; font-weight: 500; }
details.tool[open] { padding-bottom: 12px; }

/* allocation bar */
.alloc { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; }
.alloc > div { min-width: 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chartbox { position: relative; }
.chartbox canvas { width: 100%; height: 240px; display: block; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 3; }
.tip b { display: block; margin-bottom: 2px; }
.empty { text-align: center; padding: 48px 16px; color: var(--fg-2); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h2 { font-family: var(--font-display); font-size: 20px; margin: 0; color: var(--fg); }
.empty p { margin: 0; max-width: 44ch; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100vw - 32px); }

/* ===== report paper (deliberately single-theme: it is a printed document) ===== */
.sheets { overflow-x: auto; padding: 4px 2px 12px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
.sheet { box-shadow: 0 2px 18px rgba(10, 30, 25, .16); }
.page {
  --p-ink: #17221f; --p-ink2: #52605c; --p-ink3: #85918d; --p-line: #d7dfdc; --p-accent: #0d5c51; --p-soft: #eef4f2;
  --p-tw: #2a78d6; --p-us: #eb6834; --p-cash: #9aa5a1; --p-gain: #c8323a; --p-loss: #17804a;
  width: 794px; height: 1123px; background: #ffffff; color: var(--p-ink); position: relative; overflow: hidden;
  padding: 0 44px 40px; display: flex; flex-direction: column; gap: 18px;
  font-family: var(--font-body); font-size: 11px; line-height: 1.5;
}
.page.intl { --p-gain: #17804a; --p-loss: #c8323a; }
.page .pg { color: var(--p-gain); }
.page .pl { color: var(--p-loss); }
.page .band { margin: 0 -44px; padding: 26px 44px 20px; background: var(--p-accent); color: #ffffff; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
.page .band .firm { font-size: 11px; letter-spacing: .2em; color: #cfe5df; }
.page .band h1 { font-family: var(--font-display); font-size: 28px; margin: 4px 0 0; font-weight: 700; letter-spacing: .04em; }
.page .band h1 small { font-family: var(--font-body); font-size: 12px; font-weight: 400; letter-spacing: .1em; margin-left: 10px; color: #cfe5df; }
.page .band .who { text-align: right; font-size: 12px; color: #e4f1ed; }
.page .band .who b { display: block; font-size: 17px; color: #ffffff; font-weight: 600; }
.page .slim { margin: 0 -44px; padding: 18px 44px 12px; border-bottom: 2px solid var(--p-accent); display: flex; justify-content: space-between; color: var(--p-ink2); font-size: 11px; }
.page .slim b { color: var(--p-accent); font-family: var(--font-display); font-size: 14px; }
.page .facts { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--p-line); }
.page .facts > div { padding: 10px 12px; border-right: 1px solid var(--p-line); }
.page .facts > div:last-child { border-right: 0; }
.page .facts .k { font-size: 10px; color: var(--p-ink3); letter-spacing: .06em; }
.page .facts .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.page h3 { font-family: var(--font-display); font-size: 13px; margin: 0 0 8px; color: var(--p-accent); padding-bottom: 5px; border-bottom: 1px solid var(--p-line); display: flex; justify-content: space-between; align-items: baseline; }
.page h3 span { font-family: var(--font-body); font-size: 10px; color: var(--p-ink3); font-weight: 400; }
.page .two { display: grid; grid-template-columns: 1.55fr 1fr; gap: 22px; }
.page .two.eq { grid-template-columns: 1fr 1fr; }
.page table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.page th { font-weight: 500; color: var(--p-ink3); font-size: 10px; text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--p-line); white-space: nowrap; }
.page td { padding: 5px 6px; border-bottom: 1px solid var(--p-line); text-align: right; white-space: nowrap; }
.page th:first-child, .page td:first-child, .page .l { text-align: left; }
.page tr.hl td { background: var(--p-soft); font-weight: 600; }
.page .kv td { text-align: left; }
.page .kv td:first-child { color: var(--p-ink3); width: 38%; }
.page .kv td:last-child { white-space: normal; }
.page .lg { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.page .lg div { display: flex; align-items: center; gap: 8px; }
.page .lg i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.page .lg b { margin-left: auto; font-variant-numeric: tabular-nums; }
.page .bars { display: flex; flex-direction: column; gap: 5px; }
.page .bar { display: grid; grid-template-columns: 84px 1fr 44px; align-items: center; gap: 8px; }
.page .bar .tr { height: 9px; background: var(--p-soft); border-radius: 0 3px 3px 0; }
.page .bar .fl { height: 9px; background: var(--p-accent); border-radius: 0 3px 3px 0; }
.page .bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.page .cal td, .page .cal th { padding: 4px 3px; font-size: 10px; }
.page .comm { flex: 1; min-height: 0; overflow: hidden; }
.page .comm p { margin: 0 0 7px; font-size: 11.5px; line-height: 1.85; white-space: pre-wrap; text-align: justify; }
.page .disc { font-size: 9px; color: var(--p-ink3); line-height: 1.7; border-top: 1px solid var(--p-line); padding-top: 8px; }
.page .foot { position: absolute; left: 44px; right: 44px; bottom: 16px; display: flex; justify-content: space-between; font-size: 9px; color: var(--p-ink3); }
.page .nodata { color: var(--p-ink3); padding: 16px 0; }
.page .legend2 { display: flex; gap: 14px; font-size: 10px; color: var(--p-ink2); margin-top: 4px; }
.page .legend2 i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: 3px; margin-right: 5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="brand"><b id="firmName">我的投資管理</b><span>客戶資產管理台</span></div>
  <div class="spacer"></div>
  <span class="chip" id="fxChip">USD/TWD —</span>
  <button class="btn ghost" data-act="settings" id="btnSettings">設定與基準指數</button>
</header>
<div class="shell">
  <aside id="side">
    <div class="label">客戶</div>
    <div class="muted small" style="padding:8px">載入中…</div>
  </aside>
  <main id="main">
    <div class="empty"><h2>正在連線資料庫</h2><p>客戶資料存在這個頁面的私人資料庫裡，只有你本人能讀寫。</p></div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
'use strict';
/* ---------------- state ---------------- */
const S = {
  db: null, ready: { settings: false, bench: false, clients: false },
  settings: { firm: '', manager: '', fx: 32, rf: 1.5, updown: 'tw' }, settingsExists: false,
  bench: {}, benchExists: false,
  clients: {}, months: {}, monthSubs: {},
  view: 'home', sel: null, tab: 'overview', reportMonth: null,
  closeForm: null, confirmDel: false, pendingRender: false,
};
const SECTORS = ['半導體','IC 設計','電子零組件','伺服器/AI','網通','軟體','網路平台','消費','金融','醫療','能源','傳產','ETF','其他'];

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf0 = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ok = v => v != null && isFinite(v);
const money = v => ok(v) ? 'NT$ ' + nf0.format(Math.round(v)) : '—';
const moneyShort = v => !ok(v) ? '—' : Math.abs(v) >= 1e8 ? (v / 1e8).toFixed(2) + ' 億' : Math.abs(v) >= 1e4 ? nf0.format(Math.round(v / 1e4)) + ' 萬' : nf0.format(Math.round(v));
const pct = (v, d = 2, sign = true) => { if (!ok(v)) return '—'; const t = (v * 100).toFixed(d); return +t === 0 ? (0).toFixed(d) + '%' : (sign && v > 0 ? '+' : '') + t + '%'; };
const signed = v => ok(v) ? (v > 0 ? '+' : '') + nf0.format(Math.round(v)) : '—';
const cls = v => ok(v) ? (v > 0 ? 'gain' : v < 0 ? 'loss' : '') : '';
const pcls = v => ok(v) ? (v > 0 ? 'pg' : v < 0 ? 'pl' : '') : '';
const price = v => ok(v) ? nf2.format(v) : '—';
const ymOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
function addM(m, k) { let [y, mo] = m.split('-').map(Number); mo += k; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12 + 12) % 12 + 1; return y + '-' + String(mo).padStart(2, '0'); }
const lastDay = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const mLabel = m => { const [y, mo] = m.split('-'); return `${y} 年 ${+mo} 月`; };
const defaultCloseMonth = () => { const d = new Date(); return d.getDate() <= 20 ? addM(ymOf(d), -1) : ymOf(d); };
const uid = () => Math.random().toString(36).slice(2, 10);
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function hexA(hex, a) { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms); }
const numIn = v => { const n = parseFloat(String(v).replace(/[,\s]/g, '')); return isFinite(n) ? n : 0; };

/* ---------------- db writes: one at a time per doc ---------------- */
const chains = {};
function write(path, fn) {
  chains[path] = (chains[path] || Promise.resolve()).then(() => fn(S.db.doc(path))).catch(e => {
    console.error(e);
    toast(e && e.code === 'quota_exceeded' ? '資料庫容量已滿，請刪除舊資料後再試' : '儲存失敗：' + (e && e.message || e));
  });
  return chains[path];
}

/* ---------------- valuation & performance ---------------- */
function valuate(c, fx) {
  fx = fx || S.settings.fx || 0;
  let tw = 0, us = 0;
  const rows = (c.holdings || []).map(h => {
    const f = h.m === 'US' ? fx : 1;
    const v = (+h.px || 0) * (+h.sh || 0) * f;
    const costV = (+h.cost || 0) * (+h.sh || 0) * f;
    if (h.m === 'US') us += v; else tw += v;

      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="saveSettings">儲存設定</button></div>
    </div>
    <div class="panel"><h2>基準指數月底收盤 <span class="r small muted">所有客戶共用；某月報酬需要該月與前一月兩筆</span></h2>
      <details class="tool" style="margin-bottom:12px"><summary>批次貼上</summary><div style="display:flex;flex-direction:column;gap:10px">
        <p class="muted small" style="margin:0">一行一月：月份 加權指數 S&amp;P500 USD/TWD，例如 <code>2026-09 47940.13 7651.54 31.85</code></p>
        <textarea class="box" id="benchIn"></textarea><div class="row"><button class="btn primary" data-act="importBench">匯入</button></div></div></details>
      ${rows.length ? `<div class="tw"><table class="t"><thead><tr><th>月份</th><th class="n">加權指數</th><th class="n">S&amp;P 500</th><th class="n">USD/TWD</th><th class="n">加權月變動</th><th class="n">S&amp;P 月變動（台幣）</th><th></th></tr></thead><tbody>
        ${rows.map(r => { const a = S.bench[r], p = S.bench[addM(r, -1)]; const tw = p && a.taiex && p.taiex ? a.taiex / p.taiex - 1 : null; const us = p && a.spx && p.spx && a.fx && p.fx ? a.spx * a.fx / (p.spx * p.fx) - 1 : null;
          return `<tr><td><b>${r}</b></td><td class="n">${price(a.taiex)}</td><td class="n">${price(a.spx)}</td><td class="n">${ok(a.fx) ? (+a.fx).toFixed(4) : '—'}</td><td class="n ${cls(tw)}">${pct(tw)}</td><td class="n ${cls(us)}">${pct(us)}</td>
          <td>${S.confirmDel === 'b:' + r ? `<button class="btn danger" data-act="delBenchYes" data-m="${r}">確定刪除</button>` : `<button class="btn ghost danger" data-act="delBench" data-m="${r}">刪除</button>`}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="muted">尚無資料。建立月結時填入，或用上方批次貼上。</p>'}
    </div>`;
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, cid = S.sel;
  if (act !== 'delMonthYes' && act !== 'delClientYes' && act !== 'delBenchYes' && !/^del/.test(act)) S.confirmDel = false;
  switch (act) {
    case 'home': S.view = 'home'; S.sel = null; render(); break;
    case 'pick': S.view = 'client'; S.sel = el.dataset.id; S.tab = 'overview'; S.closeForm = null; S.reportMonth = null; render(); break;
    case 'tab': S.tab = el.dataset.tab; render(); break;
    case 'settings': S.view = 'settings'; render(); break;
    case 'newClient': S.view = 'newClient'; render(); break;
    case 'saveClient': saveClient(el.dataset.id || null); break;
    case 'delClient': S.confirmDel = 'c:' + el.dataset.id; render(); break;
    case 'delClientYes': deleteClient(el.dataset.id); break;
    case 'cancelDel': S.confirmDel = false; render(); break;
    case 'addH': {
      const g = id => $('#' + id).value.trim();
      const h = { m: g('nh-m'), t: g('nh-t').toUpperCase(), n: g('nh-n'), sec: g('nh-sec'), sh: numIn(g('nh-sh')), cost: numIn(g('nh-cost')), px: numIn(g('nh-px')) };
      if (!h.t) return toast('請填代號');
      const list = (S.clients[cid].holdings || []).map(x => ({ ...x }));
      const r = upsertHolding(list, h); saveHoldings(cid, list); toast(r === 'add' ? `已加入 ${h.t}` : `已更新 ${h.t}`); break;
    }
    case 'delH': saveHoldings(cid, (S.clients[cid].holdings || []).filter(h => h.id !== el.dataset.h)); break;
    case 'bulkPx': {
      const lines = $('#bulkPx').value.split('\n').map(l => l.trim().split(/[\s,，\t]+/)).filter(p => p.length >= 2 && isFinite(parseFloat(p[1])));
      if (!lines.length) return toast('沒有可辨識的「代號 價格」');
      const map = Object.fromEntries(lines.map(p => [p[0].toUpperCase(), parseFloat(p[1])]));
      const targets = $('#bulkAll').checked ? Object.keys(S.clients) : [cid];
      let hit = 0; const seen = new Set();
      for (const id of targets) {
        const list = (S.clients[id].holdings || []).map(h => { const p = map[String(h.t).toUpperCase()]; if (p != null) { hit++; seen.add(String(h.t).toUpperCase()); return { ...h, px: p }; } return h; });
        if (list.some((h, i) => h !== S.clients[id].holdings[i])) await saveHoldings(id, list, { pxAt: nowStamp() });
      }
      const miss = Object.keys(map).filter(t => !seen.has(t));
      toast(`已更新 ${hit} 筆持股現價${miss.length ? `；找不到：${miss.join('、')}` : ''}`, 4000); break;
    }
    case 'importCsv': {
      const rows = $('#csvIn').value.split('\n').map(l => l.split(/\t|,/).map(x => x.trim())).filter(r => r.length >= 5 && isFinite(parseFloat(String(r[4]).replace(/,/g, ''))));
      if (!rows.length) return toast('沒有可辨識的資料列');
      const list = (S.clients[cid].holdings || []).map(x => ({ ...x })); let a = 0, u = 0;
      rows.forEach(r => { const m = /^us|美/i.test(r[0]) ? 'US' : 'TW'; const res = upsertHolding(list, { m, t: r[1].toUpperCase(), n: r[2], sec: r[3], sh: numIn(r[4]), cost: numIn(r[5] || 0), px: numIn(r[6] || 0) }); res === 'add' ? a++ : u++; });
      saveHoldings(cid, list, { pxAt: nowStamp() }); toast(`新增 ${a} 筆、更新 ${u} 筆`); break;
    }
    case 'saveClose': saveClose(cid); break;
    case 'cancelClose': S.closeForm = null; render(); break;
    case 'editClose': { const d = (S.months[cid] || []).find(x => x.id === el.dataset.m); const bm = S.bench[d.id] || {}; S.closeForm = { cid, m: d.id, value: d.value, flow: d.flow, fx: bm.fx || d.fx, taiex: bm.taiex || '', spx: bm.spx || '' }; render(); $('#main').scrollTo?.(0, 0); window.scrollTo(0, 0); break; }
    case 'openReport': S.reportMonth = el.dataset.m; S.tab = 'report'; render(); break;
    case 'delMonth': S.confirmDel = 'm:' + el.dataset.m; render(); break;
    case 'delMonthYes': { const m = el.dataset.m; S.confirmDel = false; S.months[cid] = (S.months[cid] || []).filter(d => d.id !== m); render(); await write(`clients/${cid}/months/${m}`, ref => ref.delete()); toast(`已刪除 ${m} 月結`); break; }
    case 'pdf': exportPdf(cid); break;
    case 'draft': draftCommentary(cid); break;
    case 'saveSettings': {
      const data = { firm: $('#st-firm').value.trim(), manager: $('#st-mgr').value.trim(), fx: numIn($('#st-fx').value), rf: numIn($('#st-rf').value), updown: $('#st-ud').value };
      S.settings = { ...S.settings, ...data }; const exists = S.settingsExists; S.settingsExists = true;
      await write('settings/main', ref => exists ? ref.update(data) : ref.set(data)); toast('設定已儲存'); render(); break;
    }
    case 'importBench': {
      const rows = {}; $('#benchIn').value.split('\n').forEach(l => { const p = l.trim().split(/[\s,\t]+/); if (/^\d{4}[-/]\d{1,2}$/.test(p[0] || '') && p.length >= 4) { const [y, mo] = p[0].split(/[-/]/); rows[`${y}-${mo.padStart(2, '0')}`] = { taiex: numIn(p[1]), spx: numIn(p[2]), fx: numIn(p[3]) }; } });
      if (!Object.keys(rows).length) return toast('格式：2026-09 47940.13 7651.54 31.85');
      await saveBenchRows(rows); toast(`已匯入 ${Object.keys(rows).length} 個月`); render(); break;
    }
    case 'delBench': S.confirmDel = 'b:' + el.dataset.m; render(); break;
    case 'delBenchYes': { const m = el.dataset.m; S.confirmDel = false; const rows = { ...S.bench }; delete rows[m]; S.bench = rows; render(); await write('settings/bench', ref => ref.set({ rows })); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target, cid = S.sel;
  if (el.dataset.h && el.dataset.k) {
    const k = el.dataset.k; const val = ['sh', 'cost', 'px'].includes(k) ? numIn(el.value) : el.value.trim();
    const list = (S.clients[cid].holdings || []).map(h => h.id === el.dataset.h ? { ...h, [k]: val } : h);
    saveHoldings(cid, list, k === 'px' ? { pxAt: nowStamp() } : {});
  } else if (el.dataset.cash) {
    const data = { [el.dataset.cash]: numIn(el.value) }; S.clients[cid] = { ...S.clients[cid], ...data }; render();
    write('clients/' + cid, ref => ref.update(data));
  } else if (el.id === 'cf-m') {
    S.closeForm = { cid, m: el.value }; render();
  } else if (el.id === 'rp-m') {
    S.reportMonth = el.value; render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'rp-c') {
    const t = e.target.value; syncComm(t); $('#rp-cs').textContent = '編輯中…';
    clearTimeout(commTimer); const cid = S.sel, m = S.reportMonth; commTimer = setTimeout(() => saveComm(cid, m, t), 900);
  }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view === 'client' && S.tab === 'overview' && S.sel) drawNav(S.sel, series(S.sel)); }, 150); });
const redrawTheme = () => { if (S.view === 'client' && S.tab === 'overview') render(); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', redrawTheme);
new MutationObserver(redrawTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------------- subscriptions ---------------- */
function subMonths(cid) {
  if (S.monthSubs[cid]) return;
  S.monthSubs[cid] = S.db.collection(`clients/${cid}/months`).onSnapshot(snap => {
    S.months[cid] = snap.docs.filter(d => /^\d{4}-\d{2}$/.test(d.id)).map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
    render();
  }, err => console.error(err));
}
async function boot() {
  render();
  const db = window.claude?.use ? await window.claude.use('db') : null;
  if (!db) { S.noDb = true; render(); return; }
  S.db = db; render();
  db.doc('settings/main').onSnapshot(d => { S.settingsExists = d.exists; if (d.exists) S.settings = { ...S.settings, ...d.data() }; S.ready.settings = true; render(); }, err => console.error(err));
  db.doc('settings/bench').onSnapshot(d => { S.benchExists = d.exists; S.bench = d.exists ? { ...(d.data().rows || {}) } : {}; S.ready.bench = true; render(); }, err => console.error(err));
  db.collection('clients').onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { next[d.id] = { ...d.data() }; });
    Object.keys(S.monthSubs).forEach(id => { if (!next[id]) { S.monthSubs[id](); delete S.monthSubs[id]; delete S.months[id]; } });
    S.clients = next; Object.keys(next).forEach(subMonths);
    S.ready.clients = true;
    if (S.view === 'client' && !next[S.sel]) { S.view = 'home'; S.sel = null; }
    render();
  }, err => { console.error(err); toast('讀取客戶資料失敗'); });
}
boot();
})();
</script>
