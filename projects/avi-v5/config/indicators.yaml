# AVI V5 Indicator Configuration
# 14 indicators across 6 dimensions

indicators:
  # --- Valuation Dimension ---
  cape:
    name: "Shiller CAPE Ratio"
    source: multpl
    multpl_slug: shiller-pe
    direction: up_is_risk  # ↑=↑risk
    dimension: valuation
    weight: 0.12

  ps_ratio:
    name: "S&P 500 P/S Ratio"
    source: multpl
    multpl_slug: s-p-500-price-to-sales
    direction: up_is_risk  # ↑=↑risk
    dimension: valuation
    weight: 0.08

  fcf_yield:
    name: "S&P 500 Earnings Yield (FCF proxy)"
    source: multpl
    multpl_slug: s-p-500-earnings-yield
    direction: up_is_safe  # ↑=↓risk (higher yield = cheaper = safer)
    dimension: valuation
    weight: 0.09

  buffett_indicator:
    name: "Buffett Indicator (Market Cap / GDP)"
    source: fred
    fred_ids:
      - NCBEILQ027S  # Z.1 非金融企業權益市值($M)；FRED 已於 2024-06 下架 WILL5000IND
      - GDP
    computation: ratio  # NCBEILQ027S / (GDP*1000) -> %
    direction: up_is_risk  # ↑=↑risk
    dimension: valuation
    weight: 0.09

  # --- Profitability Dimension ---
  roic:
    name: "Corporate ROIC (Profits / Net Worth)"
    source: fred
    fred_ids:
      - A446RC1Q027SBEA
      - TNWMVBSNNCB
    computation: ratio  # profits / net_worth
    direction: up_is_safe  # ↑=↓risk (higher profitability = safer)
    dimension: profitability
    weight: 0.08

  # --- Macro Dimension ---
  # 2026-08 改版（乙案）：原本是 T10Y2Y 的「水位百分位 + up_is_risk」，
  # 效果等於「曲線越陡越危險」，與註解宣稱的「倒掛=麻煩」完全相反。
  # 但單純把方向翻成 up_is_safe 也是錯的——實證上倒掛後股市平均還會漲
  # 13-17 個月（+19%），2022-24 史上最長倒掛更是沒有衰退。
  # 水位這個「形式」本身不對，改用狀態轉折：曾倒掛 + 正在快速變陡。
  # 詳見 src/data/sources/fred.py:fetch_curve_uninversion 的完整說明。
  yield_curve_uninversion:
    name: "Yield Curve Un-inversion (steepening after inversion)"
    source: fred
    fred_ids:
      - T10Y2Y
    computation: curve_uninversion
    direction: up_is_risk  # 陡化越快=風險越高（Fed 開始降息通常代表有東西壞了）
    dimension: macro
    weight: 0.04

  vix:
    name: "CBOE Volatility Index (VIX)"
    source: fred
    fred_ids:
      - VIXCLS
    computation: direct
    direction: up_is_risk  # ↑=↑risk
    dimension: macro
    weight: 0.05

  stlfsi:
    name: "St. Louis Fed Financial Stress Index"
    source: fred
    fred_ids:
      - STLFSI4
    computation: direct
    direction: up_is_risk  # ↑=↑risk
    dimension: macro
    weight: 0.05

  # --- Rates Dimension ---
  cpi_yoy:
    name: "CPI Year-over-Year Change"
    source: fred
    fred_ids:
      - CPIAUCSL
    computation: pct_change_12  # 12-month percent change
    direction: up_is_risk  # ↑=↑risk
    dimension: rates
    weight: 0.07

  real_yield_10y:
    name: "10Y Real Yield (DGS10 - CPI YoY)"
    source: fred
    fred_ids:
      - DGS10
      - CPIAUCSL
    computation: real_yield  # DGS10 - CPI_YoY
    direction: up_is_risk  # ↑=↑risk (higher real rates = tighter)
    dimension: rates
    weight: 0.07

  # --- Credit Dimension ---
  baa_10y_spread:
    name: "BAA-10Y Corporate Bond Spread"
    source: fred
    fred_ids:
      - BAA10YM
    computation: direct
    direction: up_is_risk  # ↑=↑risk
    dimension: credit
    weight: 0.06

  baa_aaa_diff:
    name: "BAA-AAA Credit Spread Differential"
    source: fred
    fred_ids:
      - BAA
      - AAA
    computation: difference  # BAA - AAA
    direction: up_is_risk  # ↑=↑risk
    dimension: credit
    weight: 0.06

  # --- Momentum Dimension ---
  sp500_200ma_ratio:
    name: "S&P 500 / 200-Day Moving Average Ratio"
    source: yfinance
    ticker: "^GSPC"
    computation: price_over_200ma
    direction: up_is_risk  # ↑=↑risk (overextended above MA)
    dimension: momentum
    weight: 0.07

  sp500_drawdown:
    name: "S&P 500 Drawdown from Peak"
    source: yfinance
    ticker: "^GSPC"
    computation: drawdown
    direction: up_is_safe  # ↑=↓risk (drawdown value is negative; larger magnitude = more risk, but here stored as positive magnitude so direction inverted)
    dimension: momentum
    weight: 0.07
