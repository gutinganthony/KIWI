<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="880" height="700" fill="#fcfcfb"/>

  <text x="44" y="54" font-size="29" font-weight="700" fill="#0b0b0b">油價大漲之後，股市一年後會怎樣？</text>
  <text x="44" y="86" font-size="17" fill="#52514e">歷史上五次油價衝擊，之後 12 個月的美股表現。答案從 −41% 到 ＋35% 都有。</text>

  <g font-size="15">
    <rect x="44" y="106" width="16" height="16" rx="3" fill="#2a78d6"/><text x="68" y="120" fill="#0b0b0b">股市上漲</text>
    <rect x="180" y="106" width="16" height="16" rx="3" fill="#c93030"/><text x="204" y="120" fill="#0b0b0b">股市下跌</text>
  </g>

  <!-- zero line -->
  <line x1="470" y1="170" x2="470" y2="580" stroke="#c3c2b7" stroke-width="2"/>
  <text x="470" y="162" font-size="14" fill="#898781" text-anchor="middle">0%</text>

  <!-- row 1: 1973 -->
  <text x="44" y="209" font-size="19" font-weight="700" fill="#0b0b0b">1973　石油禁運</text>
  <text x="44" y="231" font-size="14" fill="#898781">之後是嚴重衰退</text>
  <rect x="183" y="193" width="287" height="44" rx="4" fill="#c93030"/>
  <text x="456" y="222" font-size="22" font-weight="700" fill="#ffffff" text-anchor="end">−41.0%</text>

  <!-- row 2: 1978 -->
  <text x="44" y="289" font-size="19" font-weight="700" fill="#0b0b0b">1978　伊朗革命</text>
  <text x="44" y="311" font-size="14" fill="#898781">衰退兩年後才來</text>
  <rect x="470" y="273" width="37" height="44" rx="4" fill="#2a78d6"/>
  <text x="519" y="302" font-size="22" font-weight="700" fill="#0b0b0b">＋5.3%</text>

  <!-- row 3: 1990 -->
  <text x="44" y="369" font-size="19" font-weight="700" fill="#0b0b0b">1990　波灣戰爭</text>
  <text x="44" y="391" font-size="14" fill="#898781">衰退已經先開始了</text>
  <rect x="470" y="353" width="60" height="44" rx="4" fill="#2a78d6"/>
  <text x="542" y="382" font-size="22" font-weight="700" fill="#0b0b0b">＋8.6%</text>

  <!-- row 4: 2003 -->
  <text x="44" y="449" font-size="19" font-weight="700" fill="#0b0b0b">2003　伊拉克戰爭</text>
  <text x="44" y="471" font-size="14" fill="#898781">沒有衰退，正在復甦</text>
  <rect x="470" y="433" width="245" height="44" rx="4" fill="#2a78d6"/>
  <text x="727" y="462" font-size="22" font-weight="700" fill="#0b0b0b">＋35.0%</text>

  <!-- row 5: 2022 -->
  <text x="44" y="529" font-size="19" font-weight="700" fill="#0b0b0b">2022　俄烏戰爭</text>
  <text x="44" y="551" font-size="14" fill="#898781">沒有衰退</text>
  <rect x="383" y="513" width="87" height="44" rx="4" fill="#c93030"/>
  <text x="371" y="542" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="end">−12.4%</text>

  <line x1="44" y1="604" x2="836" y2="604" stroke="#e1e0d9" stroke-width="1"/>
  <text x="44" y="632" font-size="18" font-weight="700" fill="#0b0b0b">油價本身不告訴你答案。決定一年後賺賠的，是後面有沒有衰退，以及你買進時多貴。</text>
  <text x="44" y="658" font-size="14" fill="#898781">資料：Ameriprise 整理之歷次油價衝擊後 12 個月 S&amp;P 500 報酬（二手轉述，未取得原始表；價格報酬或含息報酬未標明）。</text>
  <text x="44" y="680" font-size="14" fill="#898781">五個樣本太少，不能當機率使用。列出來是為了說明分歧有多大，不是為了預測這一次。</text>
</svg>
