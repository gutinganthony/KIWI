<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="880" height="700" fill="#fcfcfb"/>

  <text x="44" y="56" font-size="29" font-weight="700" fill="#0b0b0b">公司賺更多，股價還是可能跌</text>
  <text x="44" y="88" font-size="17" fill="#52514e">一年後股價變化 ＝（1＋每股盈餘變化）×（1＋本益比變化）－ 1</text>

  <!-- legend -->
  <g font-size="15">
    <rect x="44" y="108" width="18" height="18" rx="3" fill="#2a78d6"/>
    <text x="70" y="123" fill="#0b0b0b">藍色 ＝ 股價上漲</text>
    <rect x="228" y="108" width="18" height="18" rx="3" fill="#c93030"/>
    <text x="254" y="123" fill="#0b0b0b">紅色 ＝ 股價下跌</text>
    <text x="438" y="123" fill="#898781">（顏色深淺代表幅度大小，每格都標了數字）</text>
  </g>

  <!-- column header -->
  <text x="248" y="176" font-size="16" font-weight="700" fill="#52514e" text-anchor="middle">本益比 ＋10%</text>
  <text x="400" y="176" font-size="16" font-weight="700" fill="#52514e" text-anchor="middle">本益比 不變</text>
  <text x="552" y="176" font-size="16" font-weight="700" fill="#52514e" text-anchor="middle">本益比 −10%</text>
  <text x="704" y="176" font-size="16" font-weight="700" fill="#52514e" text-anchor="middle">本益比 −20%</text>
  <text x="160" y="176" font-size="16" font-weight="700" fill="#52514e" text-anchor="end">每股盈餘</text>

  <!-- row 1: EPS +15% -->
  <text x="160" y="228" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="end">＋15%</text>
  <rect x="176" y="192" width="148" height="56" rx="4" fill="#2a78d6"/><text x="250" y="228" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">＋26.5%</text>
  <rect x="328" y="192" width="148" height="56" rx="4" fill="#5598e7"/><text x="402" y="228" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋15.0%</text>
  <rect x="480" y="192" width="148" height="56" rx="4" fill="#cde2fb"/><text x="554" y="228" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋3.5%</text>
  <rect x="632" y="192" width="148" height="56" rx="4" fill="#f5adad"/><text x="706" y="228" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−8.0%</text>

  <!-- row 2: EPS +10% -->
  <text x="160" y="288" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="end">＋10%</text>
  <rect x="176" y="252" width="148" height="56" rx="4" fill="#2a78d6"/><text x="250" y="288" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">＋21.0%</text>
  <rect x="328" y="252" width="148" height="56" rx="4" fill="#5598e7"/><text x="402" y="288" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋10.0%</text>
  <rect x="480" y="252" width="148" height="56" rx="4" fill="#fbd9d9" stroke="#0b0b0b" stroke-width="2.5"/><text x="554" y="288" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−1.0%</text>
  <rect x="632" y="252" width="148" height="56" rx="4" fill="#e87070"/><text x="706" y="288" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−12.0%</text>

  <!-- row 3: EPS +5% -->
  <text x="160" y="348" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="end">＋5%</text>
  <rect x="176" y="312" width="148" height="56" rx="4" fill="#5598e7"/><text x="250" y="348" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋15.5%</text>
  <rect x="328" y="312" width="148" height="56" rx="4" fill="#9ec5f4"/><text x="402" y="348" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋5.0%</text>
  <rect x="480" y="312" width="148" height="56" rx="4" fill="#f5adad"/><text x="554" y="348" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−5.5%</text>
  <rect x="632" y="312" width="148" height="56" rx="4" fill="#e87070"/><text x="706" y="348" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−16.0%</text>

  <!-- row 4: EPS 0% -->
  <text x="160" y="408" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="end">不變</text>
  <rect x="176" y="372" width="148" height="56" rx="4" fill="#5598e7"/><text x="250" y="408" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋10.0%</text>
  <rect x="328" y="372" width="148" height="56" rx="4" fill="#f0efec"/><text x="402" y="408" font-size="22" font-weight="700" fill="#52514e" text-anchor="middle">0.0%</text>
  <rect x="480" y="372" width="148" height="56" rx="4" fill="#e87070"/><text x="554" y="408" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−10.0%</text>
  <rect x="632" y="372" width="148" height="56" rx="4" fill="#c93030"/><text x="706" y="408" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">−20.0%</text>

  <!-- row 5: EPS -10% -->
  <text x="160" y="468" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="end">−10%</text>
  <rect x="176" y="432" width="148" height="56" rx="4" fill="#fbd9d9"/><text x="250" y="468" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−1.0%</text>
  <rect x="328" y="432" width="148" height="56" rx="4" fill="#e87070"/><text x="402" y="468" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−10.0%</text>
  <rect x="480" y="432" width="148" height="56" rx="4" fill="#e87070"/><text x="554" y="468" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">−19.0%</text>
  <rect x="632" y="432" width="148" height="56" rx="4" fill="#c93030"/><text x="706" y="468" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">−28.0%</text>

  <!-- callout: arrow sits below the grid so it never crosses a value -->
  <path d="M554 528 L554 500 M545 510 L554 500 L563 510" stroke="#0b0b0b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="566" font-size="19" font-weight="700" fill="#0b0b0b">看框起來那一格：公司每股盈餘成長 10%，你還是虧 1%。</text>
  <text x="44" y="594" font-size="17" fill="#52514e">因為市場只要願意付的倍數少一成，成長就被吃掉了。而利率上升，正是壓低倍數的力量。</text>

  <line x1="44" y1="624" x2="836" y2="624" stroke="#e1e0d9" stroke-width="1"/>
  <text x="44" y="654" font-size="15" fill="#898781">這是算式的輸出，不是預測，也不含股息、匯率與稅費。用途是理解「成長」與「你賺不賺錢」不是同一件事。</text>
  <text x="44" y="678" font-size="15" fill="#898781">本益比 ＝ 股價 ÷ 每股盈餘，代表市場現在願意為「一塊錢的獲利」付幾塊錢。</text>
</svg>
