<svg xmlns="http://www.w3.org/2000/svg" width="880" height="800" viewBox="0 0 880 800" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="880" height="800" fill="#fcfcfb"/>

  <text x="44" y="54" font-size="29" font-weight="700" fill="#0b0b0b">通膨的兩半，升息其實都碰不太到</text>
  <text x="44" y="86" font-size="17" fill="#52514e">美國消費者物價，年增率。一半降下來了但不是升息的功勞，另一半根本沒降。</text>

  <!-- LEFT CARD -->
  <rect x="44" y="110" width="386" height="250" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="44" y="110" width="386" height="6" rx="3" fill="#2a78d6"/>
  <text x="68" y="150" font-size="20" font-weight="700" fill="#0b0b0b">降下來了：住房</text>

  <text x="68" y="186" font-size="15" fill="#898781">2023 年高峰</text>
  <text x="406" y="186" font-size="22" font-weight="700" fill="#898781" text-anchor="end">8.2%</text>
  <rect x="68" y="196" width="338" height="9" rx="3" fill="#cde2fb"/>

  <text x="68" y="238" font-size="15" fill="#0b0b0b">現在（2026 年 8 月）</text>
  <text x="406" y="238" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="end">3.0%</text>
  <rect x="68" y="248" width="124" height="13" rx="4" fill="#2a78d6"/>

  <line x1="68" y1="282" x2="406" y2="282" stroke="#e1e0d9" stroke-width="1"/>
  <text x="68" y="308" font-size="16" font-weight="700" fill="#0b0b0b">但這不是升息的功勞。</text>
  <text x="68" y="330" font-size="15" fill="#52514e">是 2021–22 低利率時期動工、</text>
  <text x="68" y="350" font-size="15" fill="#52514e">2023–25 集中交屋的建案潮。</text>

  <!-- RIGHT CARD -->
  <rect x="450" y="110" width="386" height="250" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="450" y="110" width="386" height="6" rx="3" fill="#eb6834"/>
  <text x="474" y="150" font-size="20" font-weight="700" fill="#0b0b0b">卡住了：住房以外的服務</text>

  <text x="474" y="186" font-size="15" fill="#898781">2026 年 7 月</text>
  <text x="812" y="186" font-size="22" font-weight="700" fill="#898781" text-anchor="end">3.0%</text>
  <rect x="474" y="196" width="124" height="9" rx="3" fill="#f7c9b4"/>

  <text x="474" y="238" font-size="15" fill="#0b0b0b">現在（2026 年 8 月）</text>
  <text x="812" y="238" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="end">3.1%</text>
  <rect x="474" y="248" width="128" height="13" rx="4" fill="#eb6834"/>

  <line x1="474" y1="282" x2="812" y2="282" stroke="#e1e0d9" stroke-width="1"/>
  <text x="474" y="308" font-size="16" font-weight="700" fill="#0b0b0b">不但沒降，還微微上去。</text>
  <text x="474" y="330" font-size="15" fill="#52514e">醫療、保險、人力服務這類，</text>
  <text x="474" y="350" font-size="15" fill="#52514e">升息本來就碰不太到。</text>

  <!-- REVERSAL BLOCK -->
  <rect x="44" y="382" width="792" height="142" rx="8" fill="#fbe9e4" stroke="#eb6834" stroke-width="1.5"/>
  <text x="68" y="418" font-size="20" font-weight="700" fill="#0b0b0b">而且幫過忙的那一半，正在轉為逆風</text>
  <text x="68" y="448" font-size="16" fill="#0b0b0b">市場上<tspan font-weight="700">新簽約</tspan>的租金已經在回升：</text>

  <text x="380" y="448" font-size="17" font-weight="700" fill="#52514e">2 月 ＋1.9%</text>
  <text x="510" y="448" font-size="17" fill="#898781">→</text>
  <text x="545" y="448" font-size="20" font-weight="700" fill="#c93030">8 月 ＋2.5%</text>
  <text x="700" y="448" font-size="15" fill="#52514e">一年多來最快</text>

  <text x="68" y="480" font-size="16" fill="#0b0b0b">空置率是 2021 年底以來<tspan font-weight="700">第一次下降</tspan>；多戶住宅新開工比兩年前少了約四成。</text>
  <text x="68" y="508" font-size="16" fill="#0b0b0b">而官方住房數字要<tspan font-weight="700">落後三到四季</tspan>才反映 ⇒ <tspan font-weight="700">住房在 2027 年是通膨的上行風險，不是下行助力。</tspan></text>

  <line x1="44" y1="552" x2="836" y2="552" stroke="#e1e0d9" stroke-width="1"/>

  <text x="44" y="584" font-size="19" font-weight="700" fill="#0b0b0b">一個反直覺、但這是文獻的主流結論：</text>
  <text x="44" y="614" font-size="17" fill="#0b0b0b">升息對<tspan font-weight="700">租金</tspan>的淨效果是<tspan font-weight="700">往上</tspan>，不是往下。</text>
  <text x="44" y="642" font-size="16" fill="#52514e">因為它把買不起房的人推回租屋市場（需求變多），同時讓建商停建（供給變少）。</text>
  <text x="44" y="666" font-size="16" fill="#52514e">升息治得了的是成交量、開工和房價；但物價指數裡的住房項量的是租金。</text>

  <rect x="44" y="686" width="792" height="44" rx="6" fill="#f0efec"/>
  <text x="68" y="714" font-size="18" font-weight="700" fill="#0b0b0b">所以：兩半升息都碰不太到，而且降下來的那一半正在往回走。</text>

  <text x="44" y="758" font-size="14" fill="#898781">資料：美國勞工統計局 CPI 2026 年 8 月；新簽約租金為 Zillow ZORI 年增率（2026 年 8 月 +2.5%）。全部為 CPI 口徑。</text>
  <text x="44" y="780" font-size="14" fill="#898781">落後三到四季引自 Cleveland Fed 工作論文 22-38；升息推升租金的實證見 Dias &amp; Duarte（2019）／Fed IFDP 1248。</text>
</svg>
