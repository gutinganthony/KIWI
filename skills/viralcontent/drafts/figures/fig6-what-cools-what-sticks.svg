<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="880" height="680" fill="#fcfcfb"/>

  <text x="44" y="54" font-size="29" font-weight="700" fill="#0b0b0b">通膨降下來的那一半，和降不下來的那一半</text>
  <text x="44" y="86" font-size="17" fill="#52514e">美國消費者物價，年增率。兩邊對利率的反應完全不同——這才是這次升息真正的難題。</text>

  <!-- LEFT CARD -->
  <rect x="44" y="110" width="386" height="300" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="44" y="110" width="386" height="6" rx="3" fill="#2a78d6"/>
  <text x="68" y="150" font-size="20" font-weight="700" fill="#0b0b0b">降下來了：住房</text>
  <text x="68" y="176" font-size="15" fill="#2a78d6" font-weight="700">對利率敏感（但反應慢 3–4 季）</text>

  <text x="68" y="228" font-size="15" fill="#898781">2023 年高峰</text>
  <text x="406" y="228" font-size="24" font-weight="700" fill="#898781" text-anchor="end">8.2%</text>
  <rect x="68" y="238" width="338" height="10" rx="3" fill="#cde2fb"/>

  <text x="68" y="286" font-size="15" fill="#0b0b0b">現在（2026 年 8 月）</text>
  <text x="406" y="286" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="end">3.0%</text>
  <rect x="68" y="296" width="124" height="14" rx="4" fill="#2a78d6"/>

  <line x1="68" y1="330" x2="406" y2="330" stroke="#e1e0d9" stroke-width="1"/>
  <text x="68" y="356" font-size="15" font-weight="700" fill="#0b0b0b">而且還沒降完。</text>
  <text x="68" y="380" font-size="15" fill="#52514e">官方數字落後真實租金約三到四季，</text>
  <text x="68" y="400" font-size="15" fill="#52514e">現在市場租金大約只有 2%。</text>

  <!-- RIGHT CARD -->
  <rect x="450" y="110" width="386" height="300" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="450" y="110" width="386" height="6" rx="3" fill="#eb6834"/>
  <text x="474" y="150" font-size="20" font-weight="700" fill="#0b0b0b">卡住了：住房以外的服務</text>
  <text x="474" y="176" font-size="15" fill="#eb6834" font-weight="700">對利率不敏感</text>

  <text x="474" y="228" font-size="15" fill="#898781">2026 年 7 月</text>
  <text x="812" y="228" font-size="24" font-weight="700" fill="#898781" text-anchor="end">3.0%</text>
  <rect x="474" y="238" width="124" height="10" rx="3" fill="#f7c9b4"/>

  <text x="474" y="286" font-size="15" fill="#0b0b0b">現在（2026 年 8 月）</text>
  <text x="812" y="286" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="end">3.1%</text>
  <rect x="474" y="296" width="128" height="14" rx="4" fill="#eb6834"/>

  <line x1="474" y1="330" x2="812" y2="330" stroke="#e1e0d9" stroke-width="1"/>
  <text x="474" y="356" font-size="15" font-weight="700" fill="#0b0b0b">不但沒降，還微微上去。</text>
  <text x="474" y="380" font-size="15" fill="#52514e">醫療、保險、人力服務這類東西，</text>
  <text x="474" y="400" font-size="15" fill="#52514e">升息碰不太到。</text>

  <!-- middle equals -->
  <text x="440" y="270" font-size="26" font-weight="700" fill="#898781" text-anchor="middle">＋</text>

  <!-- RESULT -->
  <rect x="44" y="432" width="792" height="88" rx="8" fill="#f0efec"/>
  <text x="68" y="470" font-size="20" font-weight="700" fill="#0b0b0b">結果：核心服務通膨整體還是卡在 3.0% 不動。</text>
  <text x="68" y="500" font-size="17" fill="#52514e">住房辛苦降下來的那一塊，被住房以外的服務完全抵銷掉了。</text>

  <line x1="44" y1="548" x2="836" y2="548" stroke="#e1e0d9" stroke-width="1"/>
  <text x="44" y="578" font-size="19" font-weight="700" fill="#0b0b0b">所以升息面對的是這個局面：</text>
  <text x="44" y="606" font-size="17" fill="#0b0b0b">已經降下來的那一半，本來就對利率敏感；<tspan font-weight="700">而還沒降的那一半，升息碰不太到。</tspan></text>

  <text x="44" y="644" font-size="14" fill="#898781">資料：美國勞工統計局消費者物價指數，2026 年 8 月（2026-09-11 公布）。住房落後性引自 NBER 工作論文 w34113。</text>
  <text x="44" y="666" font-size="14" fill="#898781">全部為 CPI 口徑；PCE 的權重與資料來源不同，兩者不可互推。長條長度依數值等比繪製。</text>
</svg>
