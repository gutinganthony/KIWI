<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="1040" height="700" fill="#fcfcfb"/>

  <text x="44" y="52" font-size="29" font-weight="700" fill="#0b0b0b">核心通膨有三塊，處境完全不同</text>
  <text x="44" y="82" font-size="16" fill="#52514e">2026 年 8 月的年增率。升息碰得到的只有其中一塊——而現在推高它的，剛好是升息碰不到的東西。</text>

  <!-- ===== 核心商品 ===== -->
  <rect x="44" y="108" width="300" height="316" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="44" y="108" width="300" height="6" rx="3" fill="#c93030"/>
  <text x="68" y="146" font-size="19" font-weight="700" fill="#0b0b0b">核心商品</text>
  <text x="320" y="146" font-size="14" fill="#898781" text-anchor="end">約 1/4</text>

  <text x="68" y="186" font-size="15" fill="#898781">疫情前的常態</text>
  <text x="68" y="222" font-size="30" font-weight="700" fill="#1a5fb0">−0.7%</text>
  <text x="68" y="246" font-size="14" fill="#52514e">全球化每年幫你壓低一點</text>

  <path d="M68 262 L68 284 M60 276 L68 284 L76 276" stroke="#898781" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="68" y="312" font-size="15" fill="#898781">現在</text>
  <text x="68" y="348" font-size="30" font-weight="700" fill="#b02a2a">＋0.7%</text>

  <rect x="68" y="366" width="252" height="40" rx="5" fill="#fadedd"/>
  <text x="194" y="382" font-size="14" font-weight="700" fill="#b02a2a" text-anchor="middle">結構性上移 1.4 個百分點</text>
  <text x="194" y="400" font-size="13" fill="#52514e" text-anchor="middle">那塊免費的通縮，沒了</text>

  <!-- ===== 住房 ===== -->
  <rect x="370" y="108" width="300" height="316" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="370" y="108" width="300" height="6" rx="3" fill="#1baf7a"/>
  <text x="394" y="146" font-size="19" font-weight="700" fill="#0b0b0b">住房</text>
  <text x="646" y="146" font-size="14" fill="#898781" text-anchor="end">約 1/3</text>

  <text x="394" y="186" font-size="15" fill="#898781">2023 年高峰</text>
  <text x="394" y="222" font-size="30" font-weight="700" fill="#b02a2a">8.2%</text>
  <text x="394" y="246" font-size="14" fill="#52514e">當時的通膨主角</text>

  <path d="M394 262 L394 284 M386 276 L394 284 L402 276" stroke="#898781" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="394" y="312" font-size="15" fill="#898781">現在</text>
  <text x="394" y="348" font-size="30" font-weight="700" fill="#1a5fb0">3.0%</text>

  <rect x="394" y="366" width="252" height="40" rx="5" fill="#f0efec"/>
  <text x="520" y="382" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">降了，但不是升息的功勞</text>
  <text x="520" y="400" font-size="13" fill="#52514e" text-anchor="middle">而且新約租金已經在回升</text>

  <!-- ===== 住房以外的服務 ===== -->
  <rect x="696" y="108" width="300" height="316" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="696" y="108" width="300" height="6" rx="3" fill="#898781"/>
  <text x="720" y="146" font-size="19" font-weight="700" fill="#0b0b0b">住房以外的服務</text>

  <text x="720" y="186" font-size="15" fill="#898781">現在</text>
  <text x="720" y="232" font-size="34" font-weight="700" fill="#52514e">約 3%</text>
  <text x="720" y="258" font-size="14" fill="#52514e">醫療、保險、人力服務</text>

  <line x1="720" y1="282" x2="972" y2="282" stroke="#e1e0d9" stroke-width="1.5"/>

  <text x="720" y="312" font-size="15" fill="#898781">2% 目標</text>
  <text x="972" y="312" font-size="15" font-weight="700" fill="#b02a2a" text-anchor="end">還差約 1 個百分點</text>
  <text x="720" y="342" font-size="14" fill="#52514e">漲價來自人力成本與契約</text>

  <rect x="720" y="366" width="252" height="40" rx="5" fill="#f0efec"/>
  <text x="846" y="382" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">最黏的一塊</text>
  <text x="846" y="400" font-size="13" fill="#52514e" text-anchor="middle">升息本來就碰不太到</text>

  <!-- ===== 升息碰得到誰 ===== -->
  <rect x="44" y="448" width="952" height="118" rx="8" fill="#f0efec"/>
  <text x="68" y="482" font-size="19" font-weight="700" fill="#0b0b0b">升息碰得到哪一塊？</text>

  <text x="68" y="514" font-size="16" fill="#0b0b0b"><tspan font-weight="700">住房</tspan>：碰不太到，方向可能還是反的　　　<tspan font-weight="700">住房以外的服務</tspan>：碰不太到，漲價來自人力成本和契約</text>
  <text x="68" y="542" font-size="16" fill="#0b0b0b"><tspan font-weight="700" fill="#1a5fb0">核心商品：碰得到</tspan>——升息讓美元變強、進口變便宜，也讓分期買的車和家電變貴。</text>

  <text x="44" y="604" font-size="18" font-weight="700" fill="#0b0b0b">所以升息唯一真正打得到的，就是那四分之一。</text>
  <text x="44" y="632" font-size="18" font-weight="700" fill="#b02a2a">而現在把那四分之一推上去的是關稅——關稅是稅，不是需求。</text>

  <text x="44" y="674" font-size="13" fill="#898781">核心商品與「疫情前常態」為聯準銀行研究之估計值；「住房以外的服務」由核心 CPI 扣除另兩塊推算，故以約數表示。</text>
</svg>
