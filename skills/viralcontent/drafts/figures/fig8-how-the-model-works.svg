<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="1040" height="700" fill="#fcfcfb"/>

  <text x="44" y="52" font-size="29" font-weight="700" fill="#0b0b0b">那些機率是怎麼算出來的</text>
  <text x="44" y="82" font-size="16" fill="#52514e">以及一個很多人會踩的算術陷阱。</text>

  <!-- ============ LEFT : the wrong way ============ -->
  <rect x="44" y="108" width="450" height="322" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="44" y="108" width="450" height="6" rx="3" fill="#c93030"/>
  <text x="70" y="148" font-size="19" font-weight="700" fill="#b02a2a">✗　原本的做法：三個數字相乘</text>

  <text x="70" y="184" font-size="16" fill="#0b0b0b">猜三件事的機率，然後乘起來：</text>
  <rect x="70" y="200" width="122" height="40" rx="4" fill="#f0efec"/>
  <text x="131" y="225" font-size="15" fill="#52514e" text-anchor="middle">油價</text>
  <text x="202" y="225" font-size="18" fill="#898781" text-anchor="middle">×</text>
  <rect x="214" y="200" width="122" height="40" rx="4" fill="#f0efec"/>
  <text x="275" y="225" font-size="15" fill="#52514e" text-anchor="middle">通膨</text>
  <text x="346" y="225" font-size="18" fill="#898781" text-anchor="middle">×</text>
  <rect x="358" y="200" width="112" height="40" rx="4" fill="#f0efec"/>
  <text x="414" y="225" font-size="15" fill="#52514e" text-anchor="middle">就業</text>

  <text x="70" y="276" font-size="16" fill="#0b0b0b">這個乘法偷偷假設了一件事：</text>
  <text x="70" y="302" font-size="17" font-weight="700" fill="#b02a2a">「通膨和就業互不相干。」</text>

  <text x="70" y="338" font-size="16" fill="#0b0b0b">但資料說不是——扣掉油價的影響後，</text>
  <text x="70" y="364" font-size="16" fill="#0b0b0b">通膨動能和失業率的相關係數是</text>
  <text x="70" y="400" font-size="34" font-weight="700" fill="#b02a2a">−0.41<tspan font-size="16" font-weight="400" fill="#52514e">　（1986–2025，不是 0）</tspan></text>

  <!-- ============ RIGHT : the right way ============ -->
  <rect x="518" y="108" width="478" height="322" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="518" y="108" width="478" height="6" rx="3" fill="#2a78d6"/>
  <text x="544" y="148" font-size="19" font-weight="700" fill="#1a5fb0">✓　改成：兩個軸，一個推力</text>

  <text x="544" y="184" font-size="16" fill="#0b0b0b">價格 ＝ 未來的現金流 ÷ (1 ＋ 折現率)</text>

  <rect x="544" y="202" width="200" height="56" rx="5" fill="#e8f0fc"/>
  <text x="644" y="223" font-size="15" font-weight="700" fill="#1a5fb0" text-anchor="middle">就業</text>
  <text x="644" y="245" font-size="14" fill="#52514e" text-anchor="middle">管分子（賺不賺得到）</text>

  <rect x="764" y="202" width="206" height="56" rx="5" fill="#e8f0fc"/>
  <text x="867" y="223" font-size="15" font-weight="700" fill="#1a5fb0" text-anchor="middle">通膨</text>
  <text x="867" y="245" font-size="14" fill="#52514e" text-anchor="middle">管分母（折現多少）</text>

  <text x="544" y="288" font-size="16" fill="#0b0b0b">這兩個就是情境的<tspan font-weight="700">座標軸</tspan>。</text>
  <text x="544" y="314" font-size="16" fill="#0b0b0b">油價<tspan font-weight="700">不是第三個軸</tspan>，它是推動這兩個軸的力量。</text>

  <text x="544" y="352" font-size="16" fill="#0b0b0b">至於「兩件事會不會一起發生」——</text>
  <text x="544" y="382" font-size="19" font-weight="700" fill="#0b0b0b">不猜，直接數歷史。</text>
  <text x="544" y="408" font-size="15" fill="#52514e">1986 年以來每個月往後看 12 個月，</text>
  <text x="544" y="428" font-size="15" fill="#52514e">共 <tspan font-weight="700" fill="#0b0b0b">474 組</tspan>真的發生過的組合，數每格幾組。</text>

  <!-- ============ BOTTOM : what it changed ============ -->
  <rect x="44" y="452" width="952" height="140" rx="8" fill="#f0efec"/>
  <text x="70" y="488" font-size="19" font-weight="700" fill="#0b0b0b">差別在哪：假設無關，就把「兩件壞事一起來」算得太容易</text>

  <text x="70" y="524" font-size="16" fill="#0b0b0b">停滯性通膨 ＝ 通膨燒起來 <tspan font-weight="700">而且</tspan> 就業垮掉。但這兩件事本來就<tspan font-weight="700">不太會同時發生</tspan>——</text>
  <text x="70" y="550" font-size="16" fill="#0b0b0b">需求旺的時候通膨升、失業降；需求垮的時候兩個一起反過來。<tspan font-weight="700">假設它們無關，等於把這個保護機制拆掉。</tspan></text>

  <text x="70" y="580" font-size="17" fill="#0b0b0b">結果：停滯性通膨被算成 <tspan font-weight="700" fill="#b02a2a">14%</tspan>，實際上是 <tspan font-weight="700" fill="#1a5fb0">10.8%</tspan>　—　<tspan font-weight="700">高估了 1.3 倍。</tspan></text>

  <text x="44" y="638" font-size="15" fill="#52514e">模型不會讓判斷變客觀。它做的是把主觀性關進幾個攤得開的數字，</text>
  <text x="44" y="662" font-size="15" fill="#52514e">把「兩件事會不會一起發生」交給資料，然後把每個假設攤開，讓別人可以指著其中一條說「這裡錯了」。</text>
</svg>
