<svg xmlns="http://www.w3.org/2000/svg" width="880" height="790" viewBox="0 0 880 790" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="880" height="790" fill="#fcfcfb"/>

  <text x="44" y="54" font-size="29" font-weight="700" fill="#0b0b0b">這一次，最像哪一次？</text>
  <text x="44" y="86" font-size="17" fill="#52514e">過去三十年，聯準會五次「開始升息」的當下長什麼樣，以及一年後股市走了多少。</text>

  <!-- header -->
  <line x1="44" y1="108" x2="836" y2="108" stroke="#e1e0d9" stroke-width="1"/>
  <text x="44" y="136" font-size="15" font-weight="700" fill="#52514e">開始升息的時點</text>
  <text x="345" y="136" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">停了多久</text>
  <text x="454" y="136" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">當時核心通膨</text>
  <text x="563" y="136" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">當時股市貴不貴</text>
  <text x="672" y="136" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">當時油價</text>
  <text x="781" y="136" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">一年後股市</text>
  <line x1="44" y1="150" x2="836" y2="150" stroke="#c3c2b7" stroke-width="2"/>

  <!-- 1997 -->
  <text x="44" y="180" font-size="19" font-weight="700" fill="#0b0b0b">1997 年 3 月</text>
  <text x="44" y="202" font-size="14" fill="#898781">升一次就停。四年後才衰退</text>
  <text x="345" y="186" font-size="18" fill="#0b0b0b" text-anchor="middle">14 個月</text>
  <text x="454" y="186" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">2.4%</text>
  <text x="563" y="186" font-size="18" fill="#0b0b0b" text-anchor="middle">28.8</text>
  <text x="672" y="186" font-size="18" fill="#0b0b0b" text-anchor="middle">$21</text>
  <text x="781" y="186" font-size="20" font-weight="700" fill="#2a78d6" text-anchor="middle">＋39.6%</text>
  <line x1="44" y1="216" x2="836" y2="216" stroke="#e1e0d9" stroke-width="1"/>

  <!-- 1999 -->
  <text x="44" y="246" font-size="19" font-weight="700" fill="#0b0b0b">1999 年 6 月</text>
  <text x="44" y="268" font-size="14" fill="#898781">升六次。21 個月後衰退</text>
  <text x="345" y="252" font-size="18" fill="#0b0b0b" text-anchor="middle">7 個月</text>
  <text x="454" y="252" font-size="18" fill="#0b0b0b" text-anchor="middle">2.0%</text>
  <text x="563" y="252" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">42.2</text>
  <text x="672" y="252" font-size="18" fill="#0b0b0b" text-anchor="middle">$19</text>
  <text x="781" y="252" font-size="20" font-weight="700" fill="#2a78d6" text-anchor="middle">＋6.0%</text>
  <line x1="44" y1="282" x2="836" y2="282" stroke="#e1e0d9" stroke-width="1"/>

  <!-- 2004 -->
  <text x="44" y="312" font-size="19" font-weight="700" fill="#0b0b0b">2004 年 6 月</text>
  <text x="44" y="334" font-size="14" fill="#898781">連升十七次。沒有立刻衰退</text>
  <text x="345" y="318" font-size="18" fill="#0b0b0b" text-anchor="middle">12 個月</text>
  <text x="454" y="318" font-size="18" fill="#0b0b0b" text-anchor="middle">1.9%</text>
  <text x="563" y="318" font-size="18" fill="#0b0b0b" text-anchor="middle">26.4</text>
  <text x="672" y="318" font-size="18" fill="#0b0b0b" text-anchor="middle">$37</text>
  <text x="781" y="318" font-size="20" font-weight="700" fill="#2a78d6" text-anchor="middle">＋4.4%</text>
  <line x1="44" y1="348" x2="836" y2="348" stroke="#e1e0d9" stroke-width="1"/>

  <!-- 2015 -->
  <text x="44" y="378" font-size="19" font-weight="700" fill="#0b0b0b">2015 年 12 月</text>
  <text x="44" y="400" font-size="14" fill="#898781">升一次後停了整整一年</text>
  <text x="345" y="384" font-size="16" fill="#898781" text-anchor="middle">從零利率起飛</text>
  <text x="454" y="384" font-size="18" fill="#0b0b0b" text-anchor="middle">2.1%</text>
  <text x="563" y="384" font-size="18" fill="#0b0b0b" text-anchor="middle">26.0</text>
  <text x="672" y="384" font-size="18" fill="#0b0b0b" text-anchor="middle">$36</text>
  <text x="781" y="384" font-size="20" font-weight="700" fill="#2a78d6" text-anchor="middle">＋8.9%</text>
  <line x1="44" y1="414" x2="836" y2="414" stroke="#e1e0d9" stroke-width="1"/>

  <!-- 2022 -->
  <text x="44" y="444" font-size="19" font-weight="700" fill="#0b0b0b">2022 年 3 月</text>
  <text x="44" y="466" font-size="14" fill="#898781">連升十一次。至今沒有衰退</text>
  <text x="345" y="450" font-size="16" fill="#898781" text-anchor="middle">從零利率起飛</text>
  <text x="454" y="450" font-size="18" font-weight="700" fill="#c93030" text-anchor="middle">6.5%</text>
  <text x="563" y="450" font-size="18" fill="#0b0b0b" text-anchor="middle">34.3</text>
  <text x="672" y="450" font-size="18" fill="#0b0b0b" text-anchor="middle">$95</text>
  <text x="781" y="450" font-size="20" font-weight="700" fill="#c93030" text-anchor="middle">−9.1%</text>
  <line x1="44" y1="480" x2="836" y2="480" stroke="#c3c2b7" stroke-width="2"/>

  <!-- NOW -->
  <rect x="44" y="486" width="792" height="64" rx="6" fill="#f0efec"/>
  <text x="60" y="514" font-size="20" font-weight="700" fill="#0b0b0b">現在</text>
  <text x="60" y="538" font-size="14" fill="#52514e">停了九個月，市場預期這週重啟</text>
  <text x="345" y="522" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">9 個月</text>
  <text x="454" y="522" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">2.4%</text>
  <text x="563" y="522" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">約 41</text>
  <text x="672" y="522" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">約 $100</text>
  <text x="781" y="524" font-size="26" font-weight="700" fill="#898781" text-anchor="middle">？</text>

  <line x1="44" y1="578" x2="836" y2="578" stroke="#e1e0d9" stroke-width="1"/>

  <text x="44" y="608" font-size="19" font-weight="700" fill="#0b0b0b">橫著讀一次，你會發現沒有一次完全像：</text>
  <circle cx="50" cy="635" r="4" fill="#0b0b0b"/>
  <text x="66" y="640" font-size="17" fill="#0b0b0b">停的時間和<tspan font-weight="700">通膨水準</tspan>最像 <tspan font-weight="700">1997</tspan>——那次只升了一碼就收手。</text>
  <circle cx="50" cy="663" r="4" fill="#0b0b0b"/>
  <text x="66" y="668" font-size="17" fill="#0b0b0b"><tspan font-weight="700">股市的貴</tspan>最像 <tspan font-weight="700">1999</tspan>——一百四十五年來只有那一次和現在到過這個水位。</text>
  <circle cx="50" cy="691" r="4" fill="#0b0b0b"/>
  <text x="66" y="696" font-size="17" fill="#0b0b0b"><tspan font-weight="700">油價</tspan>最像 <tspan font-weight="700">2022</tspan>——但那次起手通膨是 6.5%，現在是 2.4%，差很遠。</text>

  <line x1="44" y1="716" x2="836" y2="716" stroke="#e1e0d9" stroke-width="1"/>
  <text x="44" y="742" font-size="14" fill="#898781">股市為 S&amp;P 500 價格報酬，不含股息，以首次升息當日收盤起算。核心通膨為核心 CPI 年增率（升息當月）。</text>
  <text x="44" y="764" font-size="14" fill="#898781">「股市貴不貴」為席勒本益比（CAPE），數字越大代表相對過去十年平均獲利越貴。油價為 WTI 現貨。</text>
  <text x="44" y="786" font-size="14" fill="#898781">資料由官方原始序列自行計算。歷史不會重演，這張表是用來看形狀，不是用來推算報酬。</text>
</svg>
