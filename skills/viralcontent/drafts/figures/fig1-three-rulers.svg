<svg xmlns="http://www.w3.org/2000/svg" width="880" height="642" viewBox="0 0 880 642" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="880" height="642" fill="#fcfcfb"/>

  <text x="44" y="54" font-size="29" font-weight="700" fill="#0b0b0b">換一把尺量，兩個通膨數字就不吵了</text>
  <text x="44" y="86" font-size="17" fill="#52514e">同一批官方數據。差別只在你算的是「過去十二個月」還是「最近的速度」。</text>

  <!-- legend -->
  <g font-size="15">
    <rect x="44" y="106" width="16" height="16" rx="3" fill="#2a78d6"/><text x="68" y="120" fill="#0b0b0b">核心 CPI</text>
    <rect x="180" y="106" width="16" height="16" rx="3" fill="#eb6834"/><text x="204" y="120" fill="#0b0b0b">核心 PCE（聯準會盯的那個）</text>
    <line x1="470" y1="114" x2="502" y2="114" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="510" y="120" fill="#52514e">聯準會的 2% 目標</text>
  </g>

  <!-- panel titles -->
  <text x="44" y="158" font-size="18" font-weight="700" fill="#0b0b0b">一、同一個核心 CPI，三種算法</text>
  <text x="470" y="158" font-size="18" font-weight="700" fill="#0b0b0b">二、兩個指標，換尺之後就靠攏了</text>

  <!-- 2% reference line across both panels -->
  <line x1="44" y1="300" x2="836" y2="300" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- baseline -->
  <line x1="60" y1="430" x2="420" y2="430" stroke="#c3c2b7" stroke-width="2"/>
  <line x1="470" y1="430" x2="836" y2="430" stroke="#c3c2b7" stroke-width="2"/>

  <!-- PANEL A -->
  <rect x="80" y="192" width="70" height="238" rx="4" fill="#2a78d6"/>
  <text x="115" y="182" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">3.7%</text>
  <text x="115" y="454" font-size="15" fill="#52514e" text-anchor="middle">最近一個月</text>
  <text x="115" y="474" font-size="15" fill="#52514e" text-anchor="middle">的速度</text>
  <text x="115" y="496" font-size="13" fill="#898781" text-anchor="middle">8 月單月年化</text>

  <rect x="190" y="274" width="70" height="156" rx="4" fill="#2a78d6"/>
  <text x="225" y="264" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">2.4%</text>
  <text x="225" y="454" font-size="15" fill="#52514e" text-anchor="middle">過去十二</text>
  <text x="225" y="474" font-size="15" fill="#52514e" text-anchor="middle">個月</text>
  <text x="225" y="496" font-size="13" fill="#898781" text-anchor="middle">8 月年增率</text>

  <rect x="300" y="299" width="70" height="131" rx="4" fill="#2a78d6"/>
  <text x="335" y="289" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">2.0%</text>
  <text x="335" y="454" font-size="15" fill="#52514e" text-anchor="middle">最近三個月</text>
  <text x="335" y="474" font-size="15" fill="#52514e" text-anchor="middle">的速度</text>
  <text x="335" y="496" font-size="13" fill="#898781" text-anchor="middle">6–8 月年化</text>

  <!-- PANEL B group 1 -->
  <rect x="500" y="274" width="70" height="156" rx="4" fill="#2a78d6"/>
  <text x="535" y="264" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">2.4%</text>
  <rect x="572" y="215" width="70" height="215" rx="4" fill="#eb6834"/>
  <text x="607" y="205" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">3.3%</text>
  <text x="571" y="454" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">用年增率看</text>
  <text x="571" y="478" font-size="15" fill="#52514e" text-anchor="middle">看起來差 0.9</text>
  <text x="571" y="500" font-size="13" fill="#898781" text-anchor="middle">CPI 8 月 · PCE 7 月</text>

  <!-- PANEL B group 2 -->
  <rect x="690" y="299" width="70" height="131" rx="4" fill="#2a78d6"/>
  <text x="725" y="289" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">2.0%</text>
  <rect x="762" y="272" width="70" height="158" rx="4" fill="#eb6834"/>
  <text x="797" y="262" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">2.4%</text>
  <text x="761" y="454" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">用最近三個月看</text>
  <text x="761" y="478" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">只差 0.4</text>
  <text x="761" y="500" font-size="13" fill="#898781" text-anchor="middle">CPI 6–8 月 · PCE 5–7 月</text>

  <line x1="44" y1="524" x2="836" y2="524" stroke="#e1e0d9" stroke-width="1"/>
  <text x="44" y="552" font-size="17" font-weight="700" fill="#0b0b0b">年增率看的是過去一整年，包含早就過去的漲幅。想知道「現在」，要看最近幾個月的速度。</text>
  <text x="44" y="576" font-size="14" fill="#898781">資料：美國勞工統計局（CPI，8 月，9/11 公布）、經濟分析局（PCE，7 月，8/26 公布）。</text>
  <text x="44" y="598" font-size="14" fill="#898781">兩者最新月份不同，不能直接相減；同為 7 月時差距是 0.8。</text>
  <text x="44" y="620" font-size="14" fill="#898781">年化＝把月增率複利成整年速度，是速度換算不是預測；三個月年化為本文自行計算。</text>
</svg>
