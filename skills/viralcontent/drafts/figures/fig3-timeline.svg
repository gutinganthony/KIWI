<svg xmlns="http://www.w3.org/2000/svg" width="880" height="880" viewBox="0 0 880 880" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="880" height="880" fill="#fcfcfb"/>

  <text x="44" y="58" font-size="30" font-weight="700" fill="#0b0b0b">接下來六週：哪一天真的會動到你的錢</text>
  <text x="44" y="90" font-size="17" fill="#52514e">全部為台灣時間（UTC+8）。有時分的是已確認的發布時間。</text>

  <!-- legend -->
  <g font-size="15" fill="#52514e">
    <circle cx="52" cy="122" r="7" fill="#2a78d6"/><text x="66" y="128" fill="#0b0b0b">央行決策</text>
    <circle cx="182" cy="122" r="7" fill="#eb6834"/><text x="196" y="128" fill="#0b0b0b">通膨與就業數據</text>
    <circle cx="368" cy="122" r="7" fill="#1baf7a"/><text x="382" y="128" fill="#0b0b0b">企業財報</text>
  </g>

  <line x1="44" y1="146" x2="836" y2="146" stroke="#e1e0d9" stroke-width="1"/>

  <!-- spine -->
  <line x1="176" y1="176" x2="176" y2="806" stroke="#e1e0d9" stroke-width="2"/>

  <!-- 1 -->
  <text x="158" y="192" font-size="19" font-weight="700" text-anchor="end" fill="#0b0b0b">9/17</text>
  <text x="158" y="214" font-size="15" text-anchor="end" fill="#898781">02:00 · 02:30</text>
  <circle cx="176" cy="186" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="202" y="192" font-size="20" font-weight="700" fill="#0b0b0b">聯準會決議＋記者會</text>
  <text x="202" y="218" font-size="16" fill="#52514e">升息一碼已被高度定價。真正要看的是點陣圖年底落在哪、2027 有沒有降息。</text>

  <!-- 2 -->
  <text x="158" y="272" font-size="19" font-weight="700" text-anchor="end" fill="#0b0b0b">9/17</text>
  <circle cx="176" cy="266" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="202" y="272" font-size="20" font-weight="700" fill="#0b0b0b">台灣央行理監事會</text>
  <text x="202" y="298" font-size="16" fill="#52514e">看它怎麼講進口通膨、房貸與信用條件。不要預設它一定跟著聯準會。</text>

  <!-- 3 -->
  <text x="158" y="352" font-size="19" font-weight="700" text-anchor="end" fill="#0b0b0b">9/18</text>
  <circle cx="176" cy="346" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="202" y="352" font-size="20" font-weight="700" fill="#0b0b0b">日本央行決議</text>
  <text x="202" y="378" font-size="16" fill="#52514e">市場預期升息。做空日圓是全球最擁擠的交易之一，這格的尾巴比看起來長。</text>

  <!-- 4 -->
  <text x="158" y="432" font-size="19" font-weight="700" text-anchor="end" fill="#0b0b0b">9/30</text>
  <text x="158" y="454" font-size="15" text-anchor="end" fill="#898781">20:30</text>
  <circle cx="176" cy="426" r="9" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="202" y="432" font-size="20" font-weight="700" fill="#0b0b0b">8 月 PCE ＋ GDP 年度修訂</text>
  <text x="202" y="458" font-size="16" fill="#52514e">這是聯準會真正盯的那個通膨指標。年度修訂還可能改寫我們對成長的理解。</text>

  <!-- 5 -->
  <text x="158" y="512" font-size="19" font-weight="700" text-anchor="end" fill="#0b0b0b">10/2</text>
  <text x="158" y="534" font-size="15" text-anchor="end" fill="#898781">20:30</text>
  <circle cx="176" cy="506" r="9" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="202" y="512" font-size="20" font-weight="700" fill="#0b0b0b">9 月非農就業</text>
  <text x="202" y="538" font-size="16" fill="#52514e">看三個月平均，不要看單月。單月大好大壞多半是雜訊與修正。</text>

  <!-- 6 -->
  <text x="158" y="592" font-size="19" font-weight="700" text-anchor="end" fill="#0b0b0b">10/14</text>
  <text x="158" y="614" font-size="15" text-anchor="end" fill="#898781">20:30</text>
  <circle cx="176" cy="586" r="9" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="202" y="592" font-size="20" font-weight="700" fill="#0b0b0b">9 月消費者物價</text>
  <text x="202" y="618" font-size="16" fill="#52514e">驗證油價有沒有滲進核心。核心連續兩三個月升溫，比整體跳一次重要得多。</text>

  <!-- 7 -->
  <text x="158" y="672" font-size="19" font-weight="700" text-anchor="end" fill="#0b0b0b">10/29</text>
  <text x="158" y="694" font-size="15" text-anchor="end" fill="#898781">02:00</text>
  <circle cx="176" cy="666" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="202" y="672" font-size="20" font-weight="700" fill="#0b0b0b">聯準會再開一次</text>
  <text x="202" y="698" font-size="16" fill="#52514e">這次才知道 9 月那碼是「買保險」還是「一連串的第一碼」。</text>

  <!-- 8 -->
  <text x="158" y="752" font-size="19" font-weight="700" text-anchor="end" fill="#0b0b0b">10–11 月</text>
  <circle cx="176" cy="746" r="9" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
  <text x="202" y="752" font-size="20" font-weight="700" fill="#0b0b0b">大型雲端商財報</text>
  <text x="202" y="778" font-size="16" fill="#52514e">看 2027 年資本支出、自由現金流與怎麼付錢。只追訂單總額會看錯重點。</text>

  <line x1="44" y1="820" x2="836" y2="820" stroke="#e1e0d9" stroke-width="1"/>
  <text x="44" y="850" font-size="15" fill="#898781">確切時間以各機構公告為準。企業財報日期尚未全部公布。</text>
</svg>
