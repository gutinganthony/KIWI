<svg xmlns="http://www.w3.org/2000/svg" width="880" height="740" viewBox="0 0 880 740" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="880" height="740" fill="#fcfcfb"/>

  <text x="44" y="54" font-size="29" font-weight="700" fill="#0b0b0b">四種走法，誰會受益、誰會受傷</text>
  <text x="44" y="86" font-size="17" fill="#52514e">機率是我的主觀估計，不是模型算出來的。重點不在數字，在每一欄的形狀。</text>

  <g font-size="15">
    <rect x="44" y="106" width="16" height="16" rx="3" fill="#2a78d6"/><text x="68" y="120" fill="#0b0b0b">相對有利</text>
    <rect x="176" y="106" width="16" height="16" rx="3" fill="#f0efec" stroke="#c3c2b7"/><text x="200" y="120" fill="#0b0b0b">普通</text>
    <rect x="284" y="106" width="16" height="16" rx="3" fill="#e87070"/><text x="308" y="120" fill="#0b0b0b">相對不利</text>
    <text x="420" y="120" fill="#898781">（每格都有文字，顏色只是輔助）</text>
  </g>

  <!-- column headers -->
  <text x="352" y="168" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">現金與短債</text>
  <text x="464" y="168" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">長天期公債</text>
  <text x="576" y="168" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">高估值成長股</text>
  <text x="688" y="168" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">黃金</text>
  <text x="800" y="168" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">能源</text>

  <!-- ROW 1: A -->
  <text x="44" y="206" font-size="19" font-weight="700" fill="#0b0b0b">升一次就停，油價回落</text>
  <text x="44" y="230" font-size="16" font-weight="700" fill="#2a78d6">約 32%</text>
  <text x="120" y="230" font-size="14" fill="#898781">最像 2004–06 那條路</text>
  <rect x="300" y="186" width="104" height="54" rx="4" fill="#f0efec"/><text x="352" y="219" font-size="16" fill="#0b0b0b" text-anchor="middle">普通</text>
  <rect x="412" y="186" width="104" height="54" rx="4" fill="#2a78d6"/><text x="464" y="219" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">有利</text>
  <rect x="524" y="186" width="104" height="54" rx="4" fill="#2a78d6"/><text x="576" y="219" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最有利</text>
  <rect x="636" y="186" width="104" height="54" rx="4" fill="#f0efec"/><text x="688" y="219" font-size="16" fill="#0b0b0b" text-anchor="middle">普通</text>
  <rect x="748" y="186" width="104" height="54" rx="4" fill="#e87070"/><text x="800" y="219" font-size="16" fill="#0b0b0b" text-anchor="middle">不利</text>

  <!-- ROW 2: B -->
  <text x="44" y="286" font-size="19" font-weight="700" fill="#0b0b0b">連續升息，油價黏著</text>
  <text x="44" y="310" font-size="16" font-weight="700" fill="#2a78d6">約 38%</text>
  <text x="120" y="310" font-size="14" fill="#898781">我認為機率最高的一條</text>
  <rect x="300" y="266" width="104" height="54" rx="4" fill="#2a78d6"/><text x="352" y="299" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">有利</text>
  <rect x="412" y="266" width="104" height="54" rx="4" fill="#e87070"/><text x="464" y="299" font-size="16" fill="#0b0b0b" text-anchor="middle">不利</text>
  <rect x="524" y="266" width="104" height="54" rx="4" fill="#e87070"/><text x="576" y="299" font-size="16" fill="#0b0b0b" text-anchor="middle">不利</text>
  <rect x="636" y="266" width="104" height="54" rx="4" fill="#f0efec"/><text x="688" y="299" font-size="16" fill="#0b0b0b" text-anchor="middle">普通</text>
  <rect x="748" y="266" width="104" height="54" rx="4" fill="#2a78d6"/><text x="800" y="299" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">有利</text>

  <!-- ROW 3: C -->
  <text x="44" y="366" font-size="19" font-weight="700" fill="#0b0b0b">油價再升，需求被打壞</text>
  <text x="44" y="390" font-size="16" font-weight="700" fill="#2a78d6">約 12%</text>
  <text x="120" y="390" font-size="14" fill="#898781">最像 2011 歐洲那條路</text>
  <rect x="300" y="346" width="104" height="54" rx="4" fill="#2a78d6"/><text x="352" y="379" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">有利</text>
  <rect x="412" y="346" width="104" height="54" rx="4" fill="#f0efec"/><text x="464" y="372" font-size="15" fill="#0b0b0b" text-anchor="middle">先跌後漲</text>
  <text x="464" y="392" font-size="13" fill="#898781" text-anchor="middle">後段最強</text>
  <rect x="524" y="346" width="104" height="54" rx="4" fill="#c93030"/><text x="576" y="379" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最不利</text>
  <rect x="636" y="346" width="104" height="54" rx="4" fill="#2a78d6"/><text x="688" y="379" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">有利</text>
  <rect x="748" y="346" width="104" height="54" rx="4" fill="#f0efec"/><text x="800" y="372" font-size="15" fill="#0b0b0b" text-anchor="middle">先漲後跌</text>
  <text x="800" y="392" font-size="13" fill="#898781" text-anchor="middle">需求被打壞</text>

  <!-- ROW 4: D -->
  <text x="44" y="446" font-size="19" font-weight="700" fill="#0b0b0b">經濟夠強，撐得住高利率</text>
  <text x="44" y="470" font-size="16" font-weight="700" fill="#2a78d6">約 18%</text>
  <text x="120" y="470" font-size="14" fill="#898781">最少人在談的一條</text>
  <rect x="300" y="426" width="104" height="54" rx="4" fill="#e87070"/><text x="352" y="459" font-size="16" fill="#0b0b0b" text-anchor="middle">不利</text>
  <rect x="412" y="426" width="104" height="54" rx="4" fill="#e87070"/><text x="464" y="459" font-size="16" fill="#0b0b0b" text-anchor="middle">不利</text>
  <rect x="524" y="426" width="104" height="54" rx="4" fill="#2a78d6"/><text x="576" y="459" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">有利</text>
  <rect x="636" y="426" width="104" height="54" rx="4" fill="#e87070"/><text x="688" y="459" font-size="16" fill="#0b0b0b" text-anchor="middle">不利</text>
  <rect x="748" y="426" width="104" height="54" rx="4" fill="#f0efec"/><text x="800" y="459" font-size="16" fill="#0b0b0b" text-anchor="middle">普通</text>

  <line x1="44" y1="512" x2="836" y2="512" stroke="#e1e0d9" stroke-width="1"/>

  <text x="44" y="546" font-size="19" font-weight="700" fill="#0b0b0b">直著看每一欄，比橫著看每一列有用：</text>
  <circle cx="50" cy="573" r="4" fill="#0b0b0b"/>
  <text x="66" y="578" font-size="17" fill="#0b0b0b"><tspan font-weight="700">現金與短債</tspan>是唯一四種情況都不會太慘的一欄——代價是它在最好的那條路上跑輸。</text>
  <circle cx="50" cy="601" r="4" fill="#0b0b0b"/>
  <text x="66" y="606" font-size="17" fill="#0b0b0b"><tspan font-weight="700">高估值成長股</tspan>在機率合計約一半的兩條路上都受傷，在另外兩條路上最賺。</text>
  <circle cx="50" cy="629" r="4" fill="#0b0b0b"/>
  <text x="66" y="634" font-size="17" fill="#0b0b0b"><tspan font-weight="700">沒有任何一欄在四種情況都好。</tspan>所以問題不是「選哪個」，是「你能承受哪一種錯」。</text>

  <line x1="44" y1="664" x2="836" y2="664" stroke="#e1e0d9" stroke-width="1"/>
  <text x="44" y="692" font-size="14" fill="#898781">機率為主觀估計，會隨新資料改變；四條路加起來 100%，但真實世界不會剛好落在其中一條。</text>
  <text x="44" y="714" font-size="14" fill="#898781">格子裡的判斷是「相對於其他資產」的方向性推論，不是報酬率預測，也不是任何個別商品的建議。</text>
</svg>
