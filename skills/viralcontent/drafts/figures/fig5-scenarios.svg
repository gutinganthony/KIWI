<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="612" viewBox="0 0 1040 612" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="1040" height="612" fill="#fcfcfb"/>

  <text x="44" y="52" font-size="29" font-weight="700" fill="#0b0b0b">五種走法，誰會受益、誰會受傷</text>
  <text x="44" y="82" font-size="16" fill="#52514e">兩個問題決定你在哪一格：<tspan font-weight="700" fill="#0b0b0b">通膨有沒有回到目標</tspan>、<tspan font-weight="700" fill="#0b0b0b">就業有沒有壞掉</tspan>。</text>

  <!-- ===== header ===== -->
  <text x="44"  y="128" font-size="14" font-weight="700" fill="#898781">情境</text>
  <text x="332" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">機率</text>
  <text x="446" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">現金與短債</text>
  <text x="566" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">長天期公債</text>
  <text x="686" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">高估值成長股</text>
  <text x="806" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">黃金</text>
  <text x="926" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">能源</text>
  <line x1="44" y1="140" x2="996" y2="140" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- ===== row 1 : 黏著 33% ===== -->
  <text x="44" y="176" font-size="19" font-weight="700" fill="#0b0b0b">黏著</text>
  <text x="44" y="198" font-size="14" fill="#52514e">通膨卡在 2.5–3.5%，就業撐住</text>
  <text x="332" y="188" font-size="27" font-weight="700" fill="#0b0b0b" text-anchor="middle">33%</text>

  <rect x="390" y="156" width="112" height="44" rx="5" fill="#dbe9fa"/>
  <text x="446" y="184" font-size="16" font-weight="700" fill="#1a5fb0" text-anchor="middle">有利</text>
  <rect x="510" y="156" width="112" height="44" rx="5" fill="#fadedd"/>
  <text x="566" y="184" font-size="16" font-weight="700" fill="#b02a2a" text-anchor="middle">不利</text>
  <rect x="630" y="156" width="112" height="44" rx="5" fill="#fadedd"/>
  <text x="686" y="184" font-size="16" font-weight="700" fill="#b02a2a" text-anchor="middle">不利</text>
  <rect x="750" y="156" width="112" height="44" rx="5" fill="#f0efec"/>
  <text x="806" y="184" font-size="16" fill="#52514e" text-anchor="middle">普通</text>
  <rect x="870" y="156" width="112" height="44" rx="5" fill="#f0efec"/>
  <text x="926" y="184" font-size="16" fill="#52514e" text-anchor="middle">普通</text>

  <!-- ===== row 2 : 再加速 25% ===== -->
  <text x="44" y="256" font-size="19" font-weight="700" fill="#0b0b0b">再加速</text>
  <text x="44" y="278" font-size="14" fill="#52514e">通膨衝破 3.5%，就業撐住</text>
  <text x="332" y="268" font-size="27" font-weight="700" fill="#0b0b0b" text-anchor="middle">25%</text>

  <rect x="390" y="236" width="112" height="44" rx="5" fill="#2a78d6"/>
  <text x="446" y="264" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最有利</text>
  <rect x="510" y="236" width="112" height="44" rx="5" fill="#c93030"/>
  <text x="566" y="264" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最不利</text>
  <rect x="630" y="236" width="112" height="44" rx="5" fill="#c93030"/>
  <text x="686" y="264" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最不利</text>
  <rect x="750" y="236" width="112" height="44" rx="5" fill="#f0efec"/>
  <text x="806" y="264" font-size="16" fill="#52514e" text-anchor="middle">普通</text>
  <rect x="870" y="236" width="112" height="44" rx="5" fill="#dbe9fa"/>
  <text x="926" y="264" font-size="16" font-weight="700" fill="#1a5fb0" text-anchor="middle">有利</text>

  <!-- ===== row 3 : 軟著陸 23% ===== -->
  <text x="44" y="336" font-size="19" font-weight="700" fill="#0b0b0b">軟著陸</text>
  <text x="44" y="358" font-size="14" fill="#52514e">通膨回到目標，就業撐住</text>
  <text x="332" y="348" font-size="27" font-weight="700" fill="#0b0b0b" text-anchor="middle">23%</text>

  <rect x="390" y="316" width="112" height="44" rx="5" fill="#fadedd"/>
  <text x="446" y="344" font-size="16" font-weight="700" fill="#b02a2a" text-anchor="middle">不利</text>
  <rect x="510" y="316" width="112" height="44" rx="5" fill="#dbe9fa"/>
  <text x="566" y="344" font-size="16" font-weight="700" fill="#1a5fb0" text-anchor="middle">有利</text>
  <rect x="630" y="316" width="112" height="44" rx="5" fill="#2a78d6"/>
  <text x="686" y="344" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最有利</text>
  <rect x="750" y="316" width="112" height="44" rx="5" fill="#f0efec"/>
  <text x="806" y="344" font-size="16" fill="#52514e" text-anchor="middle">普通</text>
  <rect x="870" y="316" width="112" height="44" rx="5" fill="#f0efec"/>
  <text x="926" y="344" font-size="16" fill="#52514e" text-anchor="middle">普通</text>

  <!-- ===== row 4 : 成長驚嚇 10% ===== -->
  <text x="44" y="416" font-size="19" font-weight="700" fill="#0b0b0b">成長驚嚇</text>
  <text x="44" y="438" font-size="14" fill="#52514e">通膨回到目標，就業壞掉</text>
  <text x="332" y="428" font-size="27" font-weight="700" fill="#0b0b0b" text-anchor="middle">10%</text>

  <rect x="390" y="396" width="112" height="44" rx="5" fill="#dbe9fa"/>
  <text x="446" y="424" font-size="16" font-weight="700" fill="#1a5fb0" text-anchor="middle">有利</text>
  <rect x="510" y="396" width="112" height="44" rx="5" fill="#2a78d6"/>
  <text x="566" y="424" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最有利</text>
  <rect x="630" y="396" width="112" height="44" rx="5" fill="#fadedd"/>
  <text x="686" y="424" font-size="16" font-weight="700" fill="#b02a2a" text-anchor="middle">不利</text>
  <rect x="750" y="396" width="112" height="44" rx="5" fill="#dbe9fa"/>
  <text x="806" y="424" font-size="16" font-weight="700" fill="#1a5fb0" text-anchor="middle">有利</text>
  <rect x="870" y="396" width="112" height="44" rx="5" fill="#c93030"/>
  <text x="926" y="424" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最不利</text>

  <!-- ===== row 5 : 停滯性通膨 10% ===== -->
  <text x="44" y="496" font-size="19" font-weight="700" fill="#0b0b0b">停滯性通膨</text>
  <text x="44" y="518" font-size="14" fill="#52514e">通膨沒回去，就業也壞掉</text>
  <text x="332" y="508" font-size="27" font-weight="700" fill="#0b0b0b" text-anchor="middle">10%</text>

  <rect x="390" y="476" width="112" height="44" rx="5" fill="#dbe9fa"/>
  <text x="446" y="504" font-size="16" font-weight="700" fill="#1a5fb0" text-anchor="middle">有利</text>
  <rect x="510" y="476" width="112" height="44" rx="5" fill="#fadedd"/>
  <text x="566" y="504" font-size="16" font-weight="700" fill="#b02a2a" text-anchor="middle">不利</text>
  <rect x="630" y="476" width="112" height="44" rx="5" fill="#c93030"/>
  <text x="686" y="504" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">最不利</text>
  <rect x="750" y="476" width="112" height="44" rx="5" fill="#f0efec"/>
  <text x="806" y="504" font-size="16" fill="#52514e" text-anchor="middle">普通</text>
  <rect x="870" y="476" width="112" height="44" rx="5" fill="#f0efec"/>
  <text x="926" y="504" font-size="16" fill="#52514e" text-anchor="middle">普通</text>

  <!-- ===== legend ===== -->
  <line x1="44" y1="548" x2="996" y2="548" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="44"  y="566" width="26" height="18" rx="4" fill="#2a78d6"/>
  <text x="78"  y="580" font-size="14" fill="#52514e">最有利</text>
  <rect x="134" y="566" width="26" height="18" rx="4" fill="#dbe9fa"/>
  <text x="168" y="580" font-size="14" fill="#52514e">有利</text>
  <rect x="212" y="566" width="26" height="18" rx="4" fill="#f0efec"/>
  <text x="246" y="580" font-size="14" fill="#52514e">普通</text>
  <rect x="290" y="566" width="26" height="18" rx="4" fill="#fadedd"/>
  <text x="324" y="580" font-size="14" fill="#52514e">不利</text>
  <rect x="368" y="566" width="26" height="18" rx="4" fill="#c93030"/>
  <text x="402" y="580" font-size="14" fill="#52514e">最不利</text>
  <text x="996" y="580" font-size="14" fill="#898781" text-anchor="end">機率四捨五入到整數，誤差約 ±3–5 個百分點</text>
</svg>
