<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="1040" height="620" fill="#fcfcfb"/>

  <text x="44" y="52" font-size="29" font-weight="700" fill="#0b0b0b">成長股在每一格的拉鋸，誰贏</text>
  <text x="44" y="82" font-size="16" fill="#52514e">倍數往下拉、獲利往上推。兩邊相乘才是你拿到的報酬。</text>

  <!-- header -->
  <text x="44"  y="128" font-size="14" font-weight="700" fill="#898781">情境</text>
  <text x="420" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">倍數怎麼動</text>
  <text x="600" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">獲利要成長多少才打平</text>
  <text x="780" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">這一格實際的獲利</text>
  <text x="940" y="128" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">結果</text>
  <line x1="44" y1="140" x2="996" y2="140" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- 黏著 -->
  <text x="44" y="180" font-size="19" font-weight="700" fill="#0b0b0b">黏著</text>
  <text x="44" y="202" font-size="13" fill="#898781">50%</text>
  <text x="420" y="188" font-size="18" fill="#b02a2a" text-anchor="middle">−6.8%</text>
  <text x="600" y="188" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋7.3%</text>
  <text x="780" y="188" font-size="19" font-weight="700" fill="#1a5fb0" text-anchor="middle">＋14.1%</text>
  <rect x="884" y="166" width="112" height="32" rx="5" fill="#dbe9fa"/>
  <text x="940" y="188" font-size="15" font-weight="700" fill="#1a5fb0" text-anchor="middle">81% 過關</text>

  <!-- 軟著陸 -->
  <text x="44" y="248" font-size="19" font-weight="700" fill="#0b0b0b">軟著陸</text>
  <text x="44" y="270" font-size="13" fill="#898781">19%</text>
  <text x="420" y="256" font-size="18" font-weight="700" fill="#1a5fb0" text-anchor="middle">＋11.8%</text>
  <text x="600" y="256" font-size="19" font-weight="700" fill="#1a5fb0" text-anchor="middle">−10.6%</text>
  <text x="780" y="256" font-size="19" font-weight="700" fill="#1a5fb0" text-anchor="middle">＋12.0%</text>
  <rect x="884" y="234" width="112" height="32" rx="5" fill="#2a78d6"/>
  <text x="940" y="256" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">100% 過關</text>

  <!-- 停滯性通膨 -->
  <text x="44" y="316" font-size="19" font-weight="700" fill="#0b0b0b">停滯性通膨</text>
  <text x="44" y="338" font-size="13" fill="#898781">17%</text>
  <text x="420" y="324" font-size="18" fill="#b02a2a" text-anchor="middle">−6.8%</text>
  <text x="600" y="324" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋7.3%</text>
  <text x="780" y="324" font-size="19" font-weight="700" fill="#b02a2a" text-anchor="middle">−8.8%</text>
  <rect x="884" y="302" width="112" height="32" rx="5" fill="#c93030"/>
  <text x="940" y="324" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0% 過關</text>

  <!-- 成長驚嚇 -->
  <text x="44" y="384" font-size="19" font-weight="700" fill="#0b0b0b">成長驚嚇</text>
  <text x="44" y="406" font-size="13" fill="#898781">14%</text>
  <text x="420" y="392" font-size="18" font-weight="700" fill="#1a5fb0" text-anchor="middle">＋11.8%</text>
  <text x="600" y="392" font-size="19" font-weight="700" fill="#1a5fb0" text-anchor="middle">−10.6%</text>
  <text x="780" y="392" font-size="19" font-weight="700" fill="#b02a2a" text-anchor="middle">−11.0%</text>
  <rect x="884" y="370" width="112" height="32" rx="5" fill="#f0efec"/>
  <text x="940" y="392" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle">50% 過關</text>

  <line x1="44" y1="422" x2="996" y2="422" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- takeaway -->
  <rect x="44" y="442" width="952" height="96" rx="8" fill="#e8f0fc"/>
  <text x="70" y="474" font-size="19" font-weight="700" fill="#0b0b0b">機率最高的那一格，成長股是贏的。</text>
  <text x="70" y="502" font-size="16" fill="#0b0b0b">「通膨黏著」聽起來像壞消息，但倍數只壓 7%，而這一格的獲利成長中位數有 14%——<tspan font-weight="700">獲利跑贏了倍數。</tspan></text>
  <text x="70" y="528" font-size="16" fill="#0b0b0b">連「成長驚嚇」都只是銅板翻面：獲利掉 11%，但降息讓倍數漲 12%，<tspan font-weight="700">幾乎剛好抵銷。</tspan></text>

  <text x="44" y="572" font-size="16" font-weight="700" fill="#0b0b0b">真正要命的只有一格：通膨沒回去、獲利又轉壞。那一格歷史上 0% 過關。</text>
  <text x="44" y="598" font-size="15" fill="#52514e">倍數變化為席勒 1881–2022 同類環境的中位數（高估值放大 1.5 倍）；獲利為該格歷史窗的中位數。打平門檻 ＝ 1÷(1＋倍數變化) − 1。</text>
</svg>
