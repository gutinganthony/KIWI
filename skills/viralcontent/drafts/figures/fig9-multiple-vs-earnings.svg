<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="672" viewBox="0 0 1040 672" font-family="WenQuanYi Zen Hei, Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="1040" height="672" fill="#fcfcfb"/>

  <text x="44" y="52" font-size="29" font-weight="700" fill="#0b0b0b">成長股：倍數和獲利在拉鋸</text>
  <text x="44" y="82" font-size="16" fill="#52514e">升息壓的是倍數，但股價還有另一半——公司自己賺多少。兩邊相乘才是答案。</text>

  <rect x="44" y="102" width="952" height="46" rx="6" fill="#f0efec"/>
  <text x="520" y="132" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">股價變化 ＝ (1 ＋ EPS 成長) × (1 ＋ 倍數變化) − 1</text>

  <!-- header -->
  <text x="44"  y="190" font-size="14" font-weight="700" fill="#898781">情境</text>
  <text x="470" y="190" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">倍數會怎麼動</text>
  <text x="700" y="190" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">EPS 要成長多少才打平</text>
  <text x="920" y="190" font-size="14" font-weight="700" fill="#898781" text-anchor="middle">運氣差的話</text>
  <line x1="44" y1="202" x2="996" y2="202" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- rows -->
  <text x="44" y="238" font-size="18" font-weight="700" fill="#0b0b0b">黏著</text>
  <text x="152" y="238" font-size="14" fill="#898781">33%</text>
  <text x="470" y="238" font-size="18" fill="#52514e" text-anchor="middle">−2%</text>
  <text x="700" y="238" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋2%</text>
  <text x="920" y="238" font-size="18" fill="#b02a2a" text-anchor="middle">＋26%</text>

  <text x="44" y="288" font-size="18" font-weight="700" fill="#0b0b0b">軟著陸</text>
  <text x="152" y="288" font-size="14" fill="#898781">24%</text>
  <text x="470" y="288" font-size="18" font-weight="700" fill="#1a5fb0" text-anchor="middle">＋12%</text>
  <text x="700" y="288" font-size="20" font-weight="700" fill="#1a5fb0" text-anchor="middle">−11%</text>
  <text x="920" y="288" font-size="18" fill="#52514e" text-anchor="middle">＋5%</text>

  <text x="44" y="338" font-size="18" font-weight="700" fill="#0b0b0b">再加速</text>
  <text x="152" y="338" font-size="14" fill="#898781">23%</text>
  <text x="470" y="338" font-size="18" fill="#b02a2a" text-anchor="middle">−7%</text>
  <text x="700" y="338" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋7%</text>
  <text x="920" y="338" font-size="18" font-weight="700" fill="#b02a2a" text-anchor="middle">＋36%</text>

  <text x="44" y="388" font-size="18" font-weight="700" fill="#0b0b0b">成長驚嚇</text>
  <text x="152" y="388" font-size="14" fill="#898781">11%</text>
  <text x="470" y="388" font-size="18" font-weight="700" fill="#1a5fb0" text-anchor="middle">＋12%</text>
  <text x="700" y="388" font-size="20" font-weight="700" fill="#1a5fb0" text-anchor="middle">−11%</text>
  <text x="920" y="388" font-size="18" fill="#52514e" text-anchor="middle">＋5%</text>

  <text x="44" y="438" font-size="18" font-weight="700" fill="#0b0b0b">停滯性通膨</text>
  <text x="152" y="438" font-size="14" fill="#898781">10%</text>
  <text x="470" y="438" font-size="18" fill="#b02a2a" text-anchor="middle">−7%</text>
  <text x="700" y="438" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">＋8%</text>
  <text x="920" y="438" font-size="18" fill="#b02a2a" text-anchor="middle">＋26%</text>

  <line x1="44" y1="462" x2="996" y2="462" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- punchline -->
  <rect x="44" y="482" width="952" height="94" rx="8" fill="#e8f0fc"/>
  <text x="70" y="514" font-size="20" font-weight="700" fill="#0b0b0b">最嚴苛的那一格，門檻也只有 EPS 成長 36%——而那還是運氣差的四分之一。</text>
  <text x="70" y="544" font-size="16" fill="#0b0b0b">換句話說：<tspan font-weight="700">一家獲利真的在高速成長的公司，五格裡每一格都扛得住倍數壓縮。</tspan></text>
  <text x="70" y="566" font-size="16" font-weight="700" fill="#1a5fb0">真正的問題從來不是升息，是那個成長還在不在。</text>

  <!-- the unanswerable part -->
  <text x="44" y="612" font-size="16" font-weight="700" fill="#0b0b0b">而「還在不在」這題，歷史答不了——AI 資本支出週期才三年大，從沒遇過一次衰退。</text>
  <text x="44" y="638" font-size="15" fill="#52514e">能看的只有三件事，而且都在十月底的財報裡：<tspan font-weight="700" fill="#0b0b0b">那些錢是自己賺的還是借的</tspan>、下一年的資本支出指引有沒有下修、</text>
  <text x="44" y="660" font-size="15" fill="#52514e">折舊年限有沒有被偷偷拉長。</text>
</svg>
