name: Curve uninversion validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: projects/avi-v5/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/avi-v5/requirements.txt

      - name: Run curve_uninversion_validation
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        working-directory: projects/avi-v5
        run: python scripts/curve_uninversion_validation.py | tee /tmp/curve_validation.txt

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curve-uninversion-validation-log
          path: /tmp/curve_validation.txt
