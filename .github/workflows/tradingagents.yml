name: TradingAgents (on-demand multi-agent analysis)
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '代號：美股直接打（BE），台股上市 .TW（2303.TW），上櫃 .TWO（8271.TWO）'
        required: true
      date:
        description: '分析日 YYYY-MM-DD（空白＝今天，台北時間）'
        required: false
        default: ''
      analysts:
        description: '分析師：market,social,news,fundamentals 任選'
        required: false
        default: 'market,news,fundamentals'
      deep_model:
        description: '經理層模型（研究經理、投資組合經理）'
        required: false
        default: 'claude-opus-5-5'
      quick_model:
        description: '分析師／辯論／交易員模型'
        required: false
        default: 'claude-sonnet-5-5'

concurrency:
  group: tradingagents
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: projects/tradingagents/requirements.txt

      - name: Install TradingAgents (pinned commit)
        run: pip install -r projects/tradingagents/requirements.txt

      - name: Run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          TA_TICKER: ${{ inputs.ticker }}
          TA_DATE: ${{ inputs.date }}
          TA_ANALYSTS: ${{ inputs.analysts }}
          TRADINGAGENTS_LLM_PROVIDER: anthropic
          TRADINGAGENTS_DEEP_THINK_LLM: ${{ inputs.deep_model }}
          TRADINGAGENTS_QUICK_THINK_LLM: ${{ inputs.quick_model }}
          TRADINGAGENTS_OUTPUT_LANGUAGE: Traditional Chinese
          TRADINGAGENTS_LLM_MAX_RETRIES: '6'
        run: python projects/tradingagents/run.py

      - name: Commit reports and memory
        if: always()
        env:
          TA_TICKER: ${{ inputs.ticker }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/tradingagents/reports projects/tradingagents/memory 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "tradingagents: ${TA_TICKER} report"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
