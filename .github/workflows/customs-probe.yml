name: Customs Code Probe (one-off)

# 一次性探測：從 Actions runner（不受雲端出站封鎖）驗證台灣海關細碼月度數據能否程式化取得。
# 僅手動觸發、無排程；驗證完成即可刪除本檔。結果 commit 到 data/customs-probe/。
# 背景：topics/business/2026-07-12-taiwan-customs-data-stock-method.md §6.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: Run probe
        run: python projects/customs-probe/probe.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/customs-probe/
          if git diff --staged --quiet; then
            echo "no results to commit"
          else
            git commit -m "auto: customs probe results $(date -u +%Y-%m-%d)"
            git push
          fi
