name: Auto-update Dashboard Data

on:
  schedule:
    # 注意：GitHub cron 經常延遲 30 分鐘～數小時，所以排 3 班互為備援。
    - cron: '0 21 * * 1-5'  # 21:00 UTC = 台北 05:00 次日（美股剛收盤，最早抓到當日收盤）
    - cron: '0 23 * * 1-5'  # 23:00 UTC = 台北 07:00 次日（備援：確保台灣早晨開盤前已更新）
    - cron: '0 2 * * *'     # 02:00 UTC = 台北 10:00（每天，含週末，刷新日期戳）
  push:
    branches: [main]
    paths:                  # 計算邏輯或 workflow 本身改動時，立即重算一次
      - 'projects/avi-v5/scripts/**'
      - 'projects/avi-v5/src/**'
      - '.github/workflows/update-dashboard.yml'
  workflow_dispatch:        # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: projects/avi-v5/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/avi-v5/requirements.txt

      - name: Run dashboard update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        working-directory: projects/avi-v5
        run: python scripts/update_dashboard.py

      - name: Fetch Taiwan market data
        working-directory: projects/avi-v5
        run: python scripts/fetch_taiwan.py

      # 回測延伸資料橋：雲端 Claude 容器抓不到 yfinance/FRED/stooq，
      # 由本 job 每 ~6 天更新一次 data/ext/（SPY/QQQ/HYG/SMH/VVIX, 2019→今），
      # 供研究 session 直接 git pull 取得現代樣本。best-effort，永不擋 dashboard。
      - name: Fetch backtest extension data (weekly, best-effort)
        working-directory: projects/avi-v5
        run: python scripts/fetch_backtest_ext.py || true

      # 信用利差監控（AFI 模組 B 層 4）。2026-09-03 Jake 核准接入。
      # 這是 AI 追蹤系統裡唯一通過歷史驗證的訊號（2007 年領先 S&P 見頂 4.4 個月），
      # 也是唯一與四檔持倉有機械因果的一格。雲端 Claude 容器對 FRED 是 connect_rejected，
      # 所以只能放這裡。best-effort，永不擋 dashboard。
      - name: Fetch credit spreads (AFI layer 4, best-effort)
        id: credit
        working-directory: projects/avi-v5
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_credit_spreads.py || true

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/taiwan_data.json docs/history.json
          git add projects/avi-v5/data/ext/*.csv 2>/dev/null || true
          # 日本開示資料橋（fetch_jp_disclosures.py）的產出是 .md，不被上面的 *.csv glob 涵蓋。
          # 2026-07-27 前這行不存在 → 橋有跑但產出從未入版控、隨 runner 回收消失。
          git add projects/avi-v5/data/ext/jp_disclosures/*.md 2>/dev/null || true
          # 信用利差監控（2026-09-03 新增）：CSV 已被上面的 *.csv glob 涵蓋，但 STATUS.md 不是。
          # 同 jp_disclosures 那次的教訓——.md 產出沒被 add 就等於橋跑了但結果消失。
          git add projects/avi-v5/data/ext/credit/*.csv projects/avi-v5/data/ext/credit/*.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update dashboard data $(date -u +%Y-%m-%d)"
            git push
          fi

      # 信用利差觸發門檻時推播（只在 🟡/🔴 推，🟢 完全靜音——避免訊號疲勞）。
      - name: Notify on credit spread widening
        if: steps.credit.outputs.alert != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 projects/avi-v5/scripts/notify_ops.py \
            --title "${{ steps.credit.outputs.alert }} 信用利差走闊（AFI 層 4）" \
            --body "${{ steps.credit.outputs.body }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/blob/main/projects/avi-v5/data/ext/credit/STATUS.md" || true

      # 資料抓取/計算失敗（如 6/26 numpy 凍結、SPX NaN）時推播，避免 dashboard 靜默凍結。
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 projects/avi-v5/scripts/notify_ops.py \
            --title "❌ KIWI Dashboard 更新失敗" \
            --body "資料抓取或計算出錯，dashboard 可能停在舊數據。查 log 找原因。" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
